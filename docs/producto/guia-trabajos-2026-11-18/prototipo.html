<title>Prototipo de la guía de Orbital</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Un aparato al centro que se toca de verdad; arriba, qué versión y qué pantalla; abajo, qué decisión está detrás de cada paso.
   Se queda en oscuro a propósito: así se ve Orbital. */
:root {
  --sky: #0b0a14; --sky2: #171430; --panel: #16151f; --raised: #211f2e; --line: #2d2b3c;
  --text: #f3f1ea; --muted: #a29fb3; --faint: #6f6c82; --fresh: #5fd6c4; --warm: #f0b35a; --ink: #111017;
  --sans: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --display: "Space Grotesk", "Inter", -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--sky); color: var(--text); font: 15px/1.5 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 48px; }
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 22px; }
h1 { font: 700 28px/1.15 var(--display); margin: 0; text-wrap: balance; }
.lede { color: var(--muted); margin: 6px 0 0; max-width: 70ch; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { background: none; border: 0; color: var(--muted); font: 600 13px var(--sans); padding: 7px 14px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--ink); }
.seglabel { font-size: 12px; color: var(--faint); letter-spacing: .04em; }
.restart { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 7px 14px; font: 600 13px var(--sans); cursor: pointer; }
.stage { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 900px) { .stage { grid-template-columns: 1fr; justify-items: center; } }

/* El aparato */
.device { width: 390px; max-width: 100%; height: 780px; border-radius: 48px; border: 10px solid #24222f; background: radial-gradient(120% 70% at 50% 0%, var(--sky2), var(--sky) 70%);
  position: relative; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
.device.ipad { width: 820px; height: 600px; border-radius: 34px; }
.stars { position: absolute; inset: 0; pointer-events: none; opacity: .55;
  background-image: radial-gradient(1px 1px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 72% 9%, #fff, transparent), radial-gradient(1px 1px at 40% 62%, #fff, transparent), radial-gradient(1px 1px at 86% 44%, #fff, transparent), radial-gradient(1px 1px at 22% 84%, #fff, transparent), radial-gradient(1.5px 1.5px at 58% 30%, #cfe, transparent); }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 54px 22px 26px; gap: 14px; }
.ipad .screen { padding: 34px 40px 28px; }
.top { display: flex; align-items: center; gap: 10px; min-height: 28px; }
.back { width: 28px; height: 28px; border-radius: 50%; background: var(--raised); border: 0; color: var(--text); cursor: pointer; font-size: 15px; }
.back[hidden] { display: none; }
.dots { flex: 1; display: flex; gap: 6px; justify-content: center; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--fresh); width: 18px; border-radius: 3px; }
.dots i.done { background: #3d7d74; }
.skip { background: none; border: 0; color: var(--muted); font: 500 13px var(--sans); cursor: pointer; }
.body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
.ipad .body.two { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: center; }
.ipad .body.two > .col { display: flex; flex-direction: column; gap: 14px; }
.t { font: 700 27px/1.12 var(--display); margin: 0; text-wrap: balance; }
.s { color: var(--muted); margin: 0; font-size: 15px; }
.small { color: var(--faint); font-size: 12.5px; margin: 0; }
.actions { display: grid; gap: 9px; }
.ipad .actions { max-width: 380px; }
.btn { border: 0; border-radius: 999px; padding: 14px; font: 600 15px var(--sans); cursor: pointer; text-align: center; }
.btn.p { background: var(--text); color: var(--ink); }
.btn.g { background: var(--raised); color: var(--text); }
.btn.q { background: none; color: var(--muted); padding: 8px; }
.btn:focus-visible, .choice:focus-visible, .card:focus-visible { outline: 2px solid var(--fresh); outline-offset: 2px; }
.choice { display: flex; gap: 12px; align-items: center; text-align: left; background: var(--raised); border: 1.5px solid transparent; color: var(--text); border-radius: 16px; padding: 14px; cursor: pointer; font: 500 15px var(--sans); width: 100%; }
.choice .sub { display: block; color: var(--muted); font-size: 13px; font-weight: 400; margin-top: 2px; }
.choice .grow { flex: 1; min-width: 0; }
.choice.on { border-color: var(--fresh); }
.choice .tick { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 13px; color: var(--ink); flex: none; }
.choice.on .tick { background: var(--fresh); border-color: var(--fresh); }
.ico { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: none; background: rgba(95,214,196,.13); color: var(--fresh); font: 700 13px var(--display); }
.ico svg { width: 20px; height: 20px; }

/* Órbita de bienvenida */
.orbit { position: relative; height: 250px; flex: none; }
.ipad .orbit { height: 330px; }
.ring { position: absolute; left: 50%; top: 50%; width: 260px; height: 110px; margin: -55px 0 0 -130px; border: 1px solid rgba(95,214,196,.25); border-radius: 50%; transform: rotate(-12deg); }
.sat { position: absolute; left: 50%; top: 50%; width: 64px; height: 96px; margin: -48px 0 0 -32px; border-radius: 9px; animation: spin 14s linear infinite; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
@keyframes spin { from { transform: rotate(0deg) translateX(118px) rotate(0deg) scale(var(--sc,1)); } to { transform: rotate(360deg) translateX(118px) rotate(-360deg) scale(var(--sc,1)); } }
.core { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font: 700 30px var(--display); letter-spacing: -.01em; }
.core::after { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--fresh); margin-left: 3px; vertical-align: top; }
.promise { display: grid; gap: 8px; }
.promise div { display: flex; gap: 10px; align-items: center; font-size: 15px; opacity: 0; animation: rise .5s ease forwards; }
.promise div b { color: var(--fresh); font-weight: 600; }
.promise div:nth-child(2) { animation-delay: .35s; } .promise div:nth-child(3) { animation-delay: .7s; } .promise div:nth-child(4) { animation-delay: 1.05s; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Pósters */
.poster { border-radius: 10px; position: relative; overflow: hidden; aspect-ratio: 2/3; display: flex; align-items: flex-end; padding: 8px; font: 700 12px/1.1 var(--display); color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.deck { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.card { background: none; border: 0; padding: 0; cursor: pointer; display: grid; gap: 6px; text-align: left; color: var(--text); }
.card .why { font-size: 11.5px; color: var(--muted); }
.card.on .poster { outline: 2.5px solid var(--fresh); outline-offset: 2px; }
.toast { background: rgba(95,214,196,.14); color: var(--fresh); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; font-weight: 600; }
.code { font: 700 34px var(--display); letter-spacing: .12em; text-align: center; background: var(--raised); border-radius: 16px; padding: 18px; }
.list { display: grid; gap: 8px; }
.facts { display: grid; gap: 10px; }
.fact { display: flex; gap: 12px; align-items: flex-start; background: var(--panel); border-radius: 14px; padding: 12px; font-size: 14px; }
.fact .ico { width: 32px; height: 32px; }
.fact b { display: block; }
.fact span { color: var(--muted); font-size: 13px; }

/* Reproductor y versiones */
.player { border-radius: 14px; aspect-ratio: 16/9; background: linear-gradient(135deg, #3b2a1a, #0f0c0a 60%); position: relative; display: flex; align-items: flex-end; padding: 10px; }
.flag { display: inline-flex; gap: 6px; align-items: center; background: rgba(0,0,0,.55); border-radius: 999px; padding: 5px 10px; font-size: 12.5px; font-weight: 600; }
.tip { background: var(--text); color: var(--ink); border-radius: 14px; padding: 12px 14px; font-size: 13.5px; position: relative; }
.tip b { display: block; margin-bottom: 2px; }
.tip button { margin-top: 8px; background: var(--ink); color: var(--text); border: 0; border-radius: 999px; padding: 6px 12px; font: 600 12px var(--sans); cursor: pointer; }
.ver { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; background: var(--raised); border-radius: 14px; padding: 12px; font-size: 14px; }
.ver.best { border: 1.5px solid var(--fresh); }
.ver .reason { grid-column: 2 / 4; color: var(--fresh); font-size: 12.5px; }
.ver .meta { color: var(--muted); font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { background: var(--raised); border-radius: 999px; padding: 7px 12px; font-size: 13px; border: 1.5px solid transparent; cursor: pointer; color: var(--text); font-family: var(--sans); }
.chip.on { border-color: var(--fresh); color: var(--fresh); }

/* Inicio */
.home-head { display: flex; align-items: center; gap: 10px; }
.logo { font: 700 22px var(--display); flex: 1; }
.logo::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--fresh); margin-left: 2px; vertical-align: top; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #5fd6c4, #3b5bdb); }
.row-title { font: 600 14px var(--display); margin: 4px 0 0; }
.row-title small { color: var(--fresh); font: 500 12px var(--sans); display: block; }
.shelf { display: grid; grid-auto-flow: column; grid-auto-columns: 92px; gap: 8px; overflow: hidden; }
.ipad .shelf { grid-auto-columns: 110px; }
.nudge { display: flex; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; font-size: 13px; }
.nudge .grow { flex: 1; min-width: 0; }
.nudge button { background: var(--text); color: var(--ink); border: 0; border-radius: 999px; padding: 6px 11px; font: 600 12px var(--sans); cursor: pointer; }
.tasks { display: grid; gap: 9px; }
.langblock { display: grid; gap: 7px; }
.langblock .lb { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.langseg { display: flex; gap: 6px; flex-wrap: wrap; }
.langseg button { flex: 1; min-width: 0; background: var(--raised); color: var(--text); border: 1.5px solid transparent; border-radius: 12px; padding: 9px 6px; font: 600 12.5px var(--sans); cursor: pointer; white-space: nowrap; }
.langseg button[aria-pressed="true"] { border-color: var(--fresh); color: var(--fresh); }
.preview { background: #0f0e17; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 12px 12px 0; }
.pv-poster { aspect-ratio: 2/3; border-radius: 10px; }
.pv-body { display: grid; gap: 4px; align-content: start; min-width: 0; }
.pv-title { font: 700 16px/1.15 var(--display); }
.pv-kind { font-size: 11.5px; color: var(--muted); }
.pv-line { font-size: 12.5px; color: var(--muted); }
.pv-btn { justify-self: start; margin-top: 4px; background: var(--fresh); color: var(--ink); border-radius: 999px; padding: 5px 12px; font: 600 12px var(--sans); }
.pv-tabs { grid-column: 1 / -1; display: flex; justify-content: space-around; border-top: 1px solid var(--line); margin: 0 -12px; padding: 9px 0; font-size: 11.5px; color: var(--faint); }
.pv-tabs .on { color: var(--text); font-weight: 600; }
.lrow { display: flex; gap: 8px; align-items: center; background: var(--raised); border-radius: 14px; padding: 10px 10px 10px 12px; font-size: 14.5px; }
.lrow .grow { flex: 1; min-width: 0; }
.lrow .sub { display: block; color: var(--muted); font-size: 12px; }
.lrow .rank { width: 22px; height: 22px; border-radius: 50%; background: rgba(95,214,196,.14); color: var(--fresh); display: grid; place-items: center; font: 700 12px var(--display); flex: none; }
.mini { width: 30px; height: 30px; border-radius: 9px; border: 0; background: var(--panel); color: var(--text); font-size: 14px; cursor: pointer; }
.mini:disabled { opacity: .3; cursor: default; }
.pick { width: 100%; background: var(--panel); color: var(--text); border: 1px dashed var(--line); border-radius: 14px; padding: 12px; font: 500 14px var(--sans); }
.searchbox { background: var(--raised); border-radius: 12px; padding: 11px 12px; color: var(--muted); font-size: 14px; }
.lists-demo { display: flex; gap: 12px; align-items: flex-start; }
.sheet { position: absolute; inset: auto 0 0 0; background: #1b1a26; border-radius: 26px 26px 0 0; padding: 18px 20px 26px; display: grid; gap: 12px; box-shadow: 0 -20px 50px rgba(0,0,0,.5); max-height: 86%; overflow-y: auto; }
.ipad .sheet { left: 50%; right: auto; width: 460px; margin-left: -230px; bottom: 50%; transform: translateY(50%); border-radius: 22px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; }
.sheet-head b { font: 700 17px var(--display); }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.5); }

/* Notas a la derecha */
.notes { display: grid; gap: 12px; align-content: start; min-width: 0; }
.note { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 6px; }
.note .codes { color: var(--fresh); font: 700 13px var(--display); letter-spacing: .04em; }
.note h2 { font: 700 18px/1.2 var(--display); margin: 0; }
.note p { margin: 0; color: var(--muted); font-size: 14px; }
.note ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; display: grid; gap: 3px; }
.legend { font-size: 13px; color: var(--faint); }
@media (prefers-reduced-motion: reduce) { .sat, .promise div { animation: none; opacity: 1; } }
@media (max-width: 440px) { .device { height: 720px; border-width: 6px; border-radius: 36px; } .screen { padding: 40px 16px 20px; } .t { font-size: 24px; } }
</style>

<div class="wrap">
  <header>
    <h1>Prototipo de la guía de Orbital</h1>
    <p class="lede">Se toca como la app. Arriba eliges la versión y la pantalla; a la derecha está qué decisión hay detrás de cada paso. Es para probar el orden y las palabras, no el diseño final de cada pantalla.</p>
  </header>
  <div class="bar">
    <span class="seglabel">Versión</span>
    <div class="seg" id="ed"><button data-v="orbital">Orbital</button><button data-v="plus" aria-pressed="true">Plus</button><button data-v="ultra">Ultra</button></div>
    <span class="seglabel">Pantalla</span>
    <div class="seg" id="dev"><button data-v="iphone" aria-pressed="true">iPhone</button><button data-v="ipad">iPad y Mac</button></div>
    <button class="restart" id="restart">Empezar de nuevo</button>
  </div>
  <div class="stage">
    <div class="device" id="device"><div class="stars"></div><div class="screen" id="screen"></div></div>
    <aside class="notes" id="notes"></aside>
  </div>
</div>

<script>
const POSTERS = {
  arrival: ["Arrival", "linear-gradient(170deg,#6b7a8f,#1f2633)"], interstellar: ["Interestelar", "linear-gradient(170deg,#c9ccd2,#3a3f48)"],
  br2049: ["Blade Runner 2049", "linear-gradient(170deg,#e0703a,#3b1d1a)"], dune: ["Duna", "linear-gradient(170deg,#d39a55,#4a2c16)"],
  severance: ["Severance", "linear-gradient(170deg,#e9ece9,#46644f)"], bear: ["El oso", "linear-gradient(170deg,#3f69a8,#162236)"],
  shogun: ["Shōgun", "linear-gradient(170deg,#8b2d2d,#1b0f10)"], matrix: ["Matrix", "linear-gradient(170deg,#3f8a4f,#0d1a10)"],
  origin: ["El origen", "linear-gradient(170deg,#4d5c74,#11151d)"], chern: ["Chernobyl", "linear-gradient(170deg,#7a8578,#232822)"]
};
const poster = (k, extra = "") => `<div class="poster" style="background:${POSTERS[k][1]}" ${extra}>${POSTERS[k][0]}</div>`;
const ICON = {
  globe: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="7.5"/><path d="M2.5 10h15M10 2.5c2.2 2.3 2.2 12.7 0 15M10 2.5c-2.2 2.3-2.2 12.7 0 15"/></svg>',
  cloud: '<svg viewBox="0 0 20 20" fill="currentColor"><path d="M5.5 16a4 4 0 0 1-.5-8A5.5 5.5 0 0 1 15.6 8 4 4 0 0 1 15 16z"/></svg>',
  trakt: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="5" width="6" height="10" rx="1.5"/><rect x="12" y="5" width="6" height="10" rx="1.5"/><path d="M8 10h4"/></svg>',
  card: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="5" width="15" height="10" rx="2"/><path d="M2.5 8.5h15"/></svg>',
  bolt: '<svg viewBox="0 0 20 20" fill="currentColor"><path d="M11 2 4 11h5l-1 7 7-9h-5z"/></svg>',
  user: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="7" r="3.5"/><path d="M3.5 17c1.2-3 3.6-4.5 6.5-4.5s5.3 1.5 6.5 4.5"/></svg>',
  dice: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="14" height="14" rx="3"/><circle cx="7" cy="7" r="1" fill="currentColor"/><circle cx="13" cy="13" r="1" fill="currentColor"/><circle cx="10" cy="10" r="1" fill="currentColor"/></svg>',
  plus: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 4v12M4 10h12"/></svg>',
  play: '<svg viewBox="0 0 20 20" fill="currentColor"><path d="M6 4v12l10-6z"/></svg>',
  filter: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5h14M6 10h8M8.5 15h3"/></svg>',
  tv: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="4" width="16" height="10" rx="1.5"/><path d="M7 17h6"/></svg>'
};

// [nombre, detalle, ¿de los más usados?, bandera]
const LANGS = {
  latino: ["Español latino (doblado)", "El de México y Latinoamérica", true, "🇲🇽"],
  original: ["Idioma original", "Con subtítulos en tu idioma", true, "🎬"],
  en: ["Inglés", "", true, "🇺🇸"],
  castellano: ["Castellano (doblado)", "El de España", true, "🇪🇸"],
  pt: ["Portugués", "", true, "🇧🇷"],
  fr: ["Francés", "", false, "🇫🇷"], it: ["Italiano", "", false, "🇮🇹"], de: ["Alemán", "", false, "🇩🇪"],
  ja: ["Japonés", "", false, "🇯🇵"], ko: ["Coreano", "", false, "🇰🇷"], zh: ["Chino", "", false, "🇨🇳"], hi: ["Hindi", "", false, "🇮🇳"]
};
let S;
function reset() {
  S = { step: "welcome", hist: [], uiLang: "es", metaLang: "es", trakt: null, picked: null, cloud: null, langs: ["latino", "original", "en"], tasks: {}, sheet: null, traktSub: null, tour: null };
}
reset();
let edition = "plus", device = "iphone";
const watches = () => edition !== "orbital";

function plan() {
  const p = ["welcome", "lang", "trakt", "win"];
  if (watches()) p.push("cloud", "how");
  p.push("tour", "home");
  return p;
}
function go(step) { S.hist.push(S.step); S.step = step; S.sheet = null; S.tour = null; render(); }
function next() { const p = plan(); go(p[p.indexOf(S.step) + 1]); }
function back() { if (S.sheet) { S.sheet = null; return render(); } if (S.tour) { S.tour = null; return render(); } if (S.traktSub) { S.traktSub = null; return render(); } S.step = S.hist.pop() || "welcome"; render(); }

const NOTES = {
  welcome: ["K2-B", "¿Qué es Orbital?", "Una pantalla que se mueve sola, unos 15 segundos. La promesa no nombra a Trakt (es marca de otro). En Plus y Ultra se suma «y míralo todo aquí»; en Orbital, de la tienda, nunca se menciona ver.", ["Sin «Saltar» aquí: aún no hay nada que saltar.", "Cambia la versión arriba y mira la última línea."]],
  lang: ["Tu pedido (18 nov)", "Elige tu idioma", "Dos partes con vista previa en vivo: los menús y botones, y los títulos y sinopsis de las películas y series. Arranca con el del iPhone ya marcado: casi todos solo tocan «Continuar».", ["Hoy la app tiene un solo ajuste para las dos cosas (español o inglés): separarlas y sumar portugués es trabajo nuevo.", "En qué idioma suenan se pregunta después, en Plus y Ultra."]],
  trakt: ["K1-B", "Trakt, muy recomendado", "Dice qué ganas y qué pasa si no lo conectas. «Ahora no» siempre a la vista. «Crear una» explica cómo y te deja volver al mismo punto.", ["Conectar es con un código, como hoy.", "Sin Trakt: lo tuyo se guarda solo en este teléfono."]],
  win: ["J3 · K4-B", "Tu primer logro, antes de pedir más", "Con Trakt: «Trajimos tus vistos y tu lista». Sin Trakt: un «Decide por mí» de verdad; eliges uno y queda en Mi lista.", ["Los gustos con pósters ya no existen (K5-B).", "El porqué de cada cartel enseña de dónde salen las sugerencias."]],

function head(showBack = true) {
  const p = plan(); const i = p.indexOf(S.step);
  const dots = p.slice(0, -1).map((s, j) => `<i class="${j < i ? "done" : j === i ? "on" : ""}"></i>`).join("");
  const canSkip = S.step !== "welcome" && S.step !== "home";
  return `<div class="top"><button class="back" data-a="back" aria-label="Atrás" ${showBack && S.step !== "welcome" ? "" : "hidden"}>‹</button><div class="dots">${S.step === "home" ? "" : dots}</div>${canSkip ? '<button class="skip" data-a="skipall">Saltar guía</button>' : '<span style="width:70px"></span>'}</div>`;
}

  el.innerHTML = html;
  const n = NOTES[S.step];
  document.getElementById("notes").innerHTML = `<div class="note"><span class="codes">${n[0]}</span><h2>${n[1]}</h2><p>${n[2]}</p><ul>${n[3].map(x => `<li>${x}</li>`).join("")}</ul></div>
    <div class="note"><span class="codes">El recorrido en ${{ orbital: "Orbital", plus: "Plus", ultra: "Ultra" }[edition]}</span><p>${plan().map(s => s === S.step ? `<b style="color:var(--text)">${NOTES[s][1]}</b>` : NOTES[s][1]).join(" → ")}</p></div>
    <p class="legend">Lo que no está aquí y se enseña en su momento: la primera vez en Buscar (filtros), en los subtítulos del reproductor (desfase), cuando algo no está en tu idioma (aviso al arrancar), y todas las historias en Ajustes › Aprende.</p>`;
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-a]"); if (!t) return;
  const a = t.dataset.a, v = t.dataset.v;
  if (a === "next") next();
  else if (a === "back") back();
  else if (a === "skipall") go("home");
  else if (a === "ui") { S.uiLang = v; render(); }
  else if (a === "meta") { S.metaLang = v; render(); }
  else if (a === "sub") { S.traktSub = v || null; render(); }
  else if (a === "traktok") { S.trakt = true; S.traktSub = null; go("win"); }
  else if (a === "notrakt") { S.trakt = false; S.traktSub = null; go("win"); }
  else if (a === "pick") { S.picked = v; S.tasks.decide = true; render(); }
  else if (a === "shuffle") { render(); }
  else if (a === "sheet") { S.sheet = v || null; render(); }
  else if (a === "cloudok") { S.cloud = v; S.sheet = null; render(); }
  else if (a === "nocloud") { S.cloud = null; next(); }
  else if (a === "up" || a === "down") { const i = +v, j = a === "up" ? i - 1 : i + 1; [S.langs[i], S.langs[j]] = [S.langs[j], S.langs[i]]; render(); }
  else if (a === "drop") { S.langs.splice(+v, 1); render(); }
  else if (a === "tour") { S.tour = v; render(); }
  else if (a === "taskdone") { S.tasks[v] = true; S.tour = null; S.sheet = null; render(); }
});
function seg(id, cb) {
  document.getElementById(id).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    [...e.currentTarget.children].forEach(x => x.setAttribute("aria-pressed", x === b)); cb(b.dataset.v);
  });
}
seg("ed", v => { edition = v; reset(); render(); });
seg("dev", v => { device = v; document.getElementById("device").classList.toggle("ipad", v === "ipad"); render(); });
document.addEventListener("change", e => { if (e.target.id === "addlang" && e.target.value) { S.langs.push(e.target.value); render(); } });
document.getElementById("restart").addEventListener("click", () => { reset(); render(); });
render();
</script>
