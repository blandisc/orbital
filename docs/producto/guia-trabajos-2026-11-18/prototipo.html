<title>Prototipo de la guía de Orbital</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Un aparato al centro que se toca de verdad; arriba, qué versión y qué pantalla; abajo, qué decisión está detrás de cada paso.
   Se queda en oscuro a propósito: así se ve Orbital. */
:root {
  --sky: #0b0a14; --sky2: #171430; --panel: #16151f; --raised: #211f2e; --line: #2d2b3c;
  --text: #f3f1ea; --muted: #a29fb3; --faint: #6f6c82; --fresh: #5fd6c4; --warm: #f0b35a; --ink: #111017;
  --sans: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --display: "Space Grotesk", "Inter", -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--sky); color: var(--text); font: 15px/1.5 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 48px; }
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 22px; }
h1 { font: 700 28px/1.15 var(--display); margin: 0; text-wrap: balance; }
.lede { color: var(--muted); margin: 6px 0 0; max-width: 70ch; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { background: none; border: 0; color: var(--muted); font: 600 13px var(--sans); padding: 7px 14px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--ink); }
.seglabel { font-size: 12px; color: var(--faint); letter-spacing: .04em; }
.restart { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 7px 14px; font: 600 13px var(--sans); cursor: pointer; }
.stage { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 900px) { .stage { grid-template-columns: 1fr; justify-items: center; } }

/* El aparato */
.device { width: 390px; max-width: 100%; height: 780px; border-radius: 48px; border: 10px solid #24222f; background: radial-gradient(120% 70% at 50% 0%, var(--sky2), var(--sky) 70%);
  position: relative; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
.device.ipad { width: 820px; height: 600px; border-radius: 34px; }
.stars { position: absolute; inset: 0; pointer-events: none; opacity: .55;
  background-image: radial-gradient(1px 1px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 72% 9%, #fff, transparent), radial-gradient(1px 1px at 40% 62%, #fff, transparent), radial-gradient(1px 1px at 86% 44%, #fff, transparent), radial-gradient(1px 1px at 22% 84%, #fff, transparent), radial-gradient(1.5px 1.5px at 58% 30%, #cfe, transparent); }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 54px 22px 26px; gap: 14px; }
.ipad .screen { padding: 34px 40px 28px; }
.top { display: flex; align-items: center; gap: 10px; min-height: 28px; }
.back { width: 28px; height: 28px; border-radius: 50%; background: var(--raised); border: 0; color: var(--text); cursor: pointer; font-size: 15px; }
.back[hidden] { display: none; }
.dots { flex: 1; display: flex; gap: 6px; justify-content: center; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--fresh); width: 18px; border-radius: 3px; }
.dots i.done { background: #3d7d74; }
.skip { background: none; border: 0; color: var(--muted); font: 500 13px var(--sans); cursor: pointer; }
.body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
.ipad .body.two { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: center; }
.ipad .body.two > .col { display: flex; flex-direction: column; gap: 14px; }
.t { font: 700 27px/1.12 var(--display); margin: 0; text-wrap: balance; }
.s { color: var(--muted); margin: 0; font-size: 15px; }
.small { color: var(--faint); font-size: 12.5px; margin: 0; }
.actions { display: grid; gap: 9px; }
.ipad .actions { max-width: 380px; }
.btn { border: 0; border-radius: 999px; padding: 14px; font: 600 15px var(--sans); cursor: pointer; text-align: center; }
.btn.p { background: var(--text); color: var(--ink); }
.btn.g { background: var(--raised); color: var(--text); }
.btn.q { background: none; color: var(--muted); padding: 8px; }
.btn:focus-visible, .choice:focus-visible, .card:focus-visible { outline: 2px solid var(--fresh); outline-offset: 2px; }
.choice { display: flex; gap: 12px; align-items: center; text-align: left; background: var(--raised); border: 1.5px solid transparent; color: var(--text); border-radius: 16px; padding: 14px; cursor: pointer; font: 500 15px var(--sans); width: 100%; }
.choice .sub { display: block; color: var(--muted); font-size: 13px; font-weight: 400; margin-top: 2px; }
.choice .grow { flex: 1; min-width: 0; }
.choice.on { border-color: var(--fresh); }
.choice .tick { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 13px; color: var(--ink); flex: none; }
.choice.on .tick { background: var(--fresh); border-color: var(--fresh); }
.ico { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: none; background: rgba(95,214,196,.13); color: var(--fresh); font: 700 13px var(--display); }
.ico svg { width: 20px; height: 20px; }

/* Órbita de bienvenida */
.orbit { position: relative; height: 250px; flex: none; }
.ipad .orbit { height: 330px; }
.ring { position: absolute; left: 50%; top: 50%; width: 260px; height: 110px; margin: -55px 0 0 -130px; border: 1px solid rgba(95,214,196,.25); border-radius: 50%; transform: rotate(-12deg); }
.sat { position: absolute; left: 50%; top: 50%; width: 64px; height: 96px; margin: -48px 0 0 -32px; border-radius: 9px; animation: spin 14s linear infinite; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
@keyframes spin { from { transform: rotate(0deg) translateX(118px) rotate(0deg) scale(var(--sc,1)); } to { transform: rotate(360deg) translateX(118px) rotate(-360deg) scale(var(--sc,1)); } }
.core { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font: 700 30px var(--display); letter-spacing: -.01em; }
.core::after { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--fresh); margin-left: 3px; vertical-align: top; }
.promise { display: grid; gap: 8px; }
.promise div { display: flex; gap: 10px; align-items: center; font-size: 15px; opacity: 0; animation: rise .5s ease forwards; }
.promise div b { color: var(--fresh); font-weight: 600; }
.promise div:nth-child(2) { animation-delay: .35s; } .promise div:nth-child(3) { animation-delay: .7s; } .promise div:nth-child(4) { animation-delay: 1.05s; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Pósters */
.poster { border-radius: 10px; position: relative; overflow: hidden; aspect-ratio: 2/3; display: flex; align-items: flex-end; padding: 8px; font: 700 12px/1.1 var(--display); color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.deck { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.card { background: none; border: 0; padding: 0; cursor: pointer; display: grid; gap: 6px; text-align: left; color: var(--text); }
.card .why { font-size: 11.5px; color: var(--muted); }
.card.on .poster { outline: 2.5px solid var(--fresh); outline-offset: 2px; }
.toast { background: rgba(95,214,196,.14); color: var(--fresh); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; font-weight: 600; }
.code { font: 700 34px var(--display); letter-spacing: .12em; text-align: center; background: var(--raised); border-radius: 16px; padding: 18px; }
.list { display: grid; gap: 8px; }
.facts { display: grid; gap: 10px; }
.fact { display: flex; gap: 12px; align-items: flex-start; background: var(--panel); border-radius: 14px; padding: 12px; font-size: 14px; }
.fact .ico { width: 32px; height: 32px; }
.fact b { display: block; }
.fact span { color: var(--muted); font-size: 13px; }

/* Reproductor y versiones */
.player { border-radius: 14px; aspect-ratio: 16/9; background: linear-gradient(135deg, #3b2a1a, #0f0c0a 60%); position: relative; display: flex; align-items: flex-end; padding: 10px; }
.flag { display: inline-flex; gap: 6px; align-items: center; background: rgba(0,0,0,.55); border-radius: 999px; padding: 5px 10px; font-size: 12.5px; font-weight: 600; }
.tip { background: var(--text); color: var(--ink); border-radius: 14px; padding: 12px 14px; font-size: 13.5px; position: relative; }
.tip b { display: block; margin-bottom: 2px; }
.tip button { margin-top: 8px; background: var(--ink); color: var(--text); border: 0; border-radius: 999px; padding: 6px 12px; font: 600 12px var(--sans); cursor: pointer; }
.ver { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; background: var(--raised); border-radius: 14px; padding: 12px; font-size: 14px; }
.ver.best { border: 1.5px solid var(--fresh); }
.ver .reason { grid-column: 2 / 4; color: var(--fresh); font-size: 12.5px; }
.ver .meta { color: var(--muted); font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { background: var(--raised); border-radius: 999px; padding: 7px 12px; font-size: 13px; border: 1.5px solid transparent; cursor: pointer; color: var(--text); font-family: var(--sans); }
.chip.on { border-color: var(--fresh); color: var(--fresh); }

/* Inicio */
.home-head { display: flex; align-items: center; gap: 10px; }
.logo { font: 700 22px var(--display); flex: 1; }
.logo::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--fresh); margin-left: 2px; vertical-align: top; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #5fd6c4, #3b5bdb); }
.row-title { font: 600 14px var(--display); margin: 4px 0 0; }
.row-title small { color: var(--fresh); font: 500 12px var(--sans); display: block; }
.shelf { display: grid; grid-auto-flow: column; grid-auto-columns: 92px; gap: 8px; overflow: hidden; }
.ipad .shelf { grid-auto-columns: 110px; }
.nudge { display: flex; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; font-size: 13px; }
.nudge .grow { flex: 1; min-width: 0; }
.nudge button { background: var(--text); color: var(--ink); border: 0; border-radius: 999px; padding: 6px 11px; font: 600 12px var(--sans); cursor: pointer; }
.tasks { display: grid; gap: 9px; }
.langblock { display: grid; gap: 7px; }
.langblock .lb { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.langseg { display: flex; gap: 6px; flex-wrap: wrap; }
.langseg button { flex: 1; min-width: 0; background: var(--raised); color: var(--text); border: 1.5px solid transparent; border-radius: 12px; padding: 9px 6px; font: 600 12.5px var(--sans); cursor: pointer; white-space: nowrap; }
.langseg button[aria-pressed="true"] { border-color: var(--fresh); color: var(--fresh); }
.preview { background: #0f0e17; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 12px 12px 0; }
.pv-poster { aspect-ratio: 2/3; border-radius: 10px; }
.pv-body { display: grid; gap: 4px; align-content: start; min-width: 0; }
.pv-title { font: 700 16px/1.15 var(--display); }
.pv-kind { font-size: 11.5px; color: var(--muted); }
.pv-line { font-size: 12.5px; color: var(--muted); }
.pv-btn { justify-self: start; margin-top: 4px; background: var(--fresh); color: var(--ink); border-radius: 999px; padding: 5px 12px; font: 600 12px var(--sans); }
.pv-tabs { grid-column: 1 / -1; display: flex; justify-content: space-around; border-top: 1px solid var(--line); margin: 0 -12px; padding: 9px 0; font-size: 11.5px; color: var(--faint); }
.pv-tabs .on { color: var(--text); font-weight: 600; }
.lrow { display: flex; gap: 8px; align-items: center; background: var(--raised); border-radius: 14px; padding: 10px 10px 10px 12px; font-size: 14.5px; }
.lrow .grow { flex: 1; min-width: 0; }
.lrow .sub { display: block; color: var(--muted); font-size: 12px; }
.lrow .rank { width: 22px; height: 22px; border-radius: 50%; background: rgba(95,214,196,.14); color: var(--fresh); display: grid; place-items: center; font: 700 12px var(--display); flex: none; }
.mini { width: 30px; height: 30px; border-radius: 9px; border: 0; background: var(--panel); color: var(--text); font-size: 14px; cursor: pointer; }
.mini:disabled { opacity: .3; cursor: default; }
.pick { width: 100%; background: var(--panel); color: var(--text); border: 1px dashed var(--line); border-radius: 14px; padding: 12px; font: 500 14px var(--sans); }
.searchbox { background: var(--raised); border-radius: 12px; padding: 11px 12px; color: var(--muted); font-size: 14px; }
.lists-demo { display: flex; gap: 12px; align-items: flex-start; }
.sheet { position: absolute; inset: auto 0 0 0; background: #1b1a26; border-radius: 26px 26px 0 0; padding: 18px 20px 26px; display: grid; gap: 12px; box-shadow: 0 -20px 50px rgba(0,0,0,.5); max-height: 86%; overflow-y: auto; }
.ipad .sheet { left: 50%; right: auto; width: 460px; margin-left: -230px; bottom: 50%; transform: translateY(50%); border-radius: 22px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; }
.sheet-head b { font: 700 17px var(--display); }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.5); }

/* Notas a la derecha */
.notes { display: grid; gap: 12px; align-content: start; min-width: 0; }
.note { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 6px; }
.note .codes { color: var(--fresh); font: 700 13px var(--display); letter-spacing: .04em; }
.note h2 { font: 700 18px/1.2 var(--display); margin: 0; }
.note p { margin: 0; color: var(--muted); font-size: 14px; }
.note ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; display: grid; gap: 3px; }
.legend { font-size: 13px; color: var(--faint); }
@media (prefers-reduced-motion: reduce) { .sat, .promise div { animation: none; opacity: 1; } }
@media (max-width: 440px) { .device { height: 720px; border-width: 6px; border-radius: 36px; } .screen { padding: 40px 16px 20px; } .t { font-size: 24px; } }
.promise div:nth-child(5) { animation-delay: 1.4s; }
.switch { display: flex; gap: 12px; align-items: center; text-align: left; background: var(--raised); border: 0; color: var(--text); border-radius: 14px; padding: 12px 14px; font: 500 14.5px var(--sans); cursor: pointer; width: 100%; }
.switch .grow { flex: 1; min-width: 0; } .switch .sub { display: block; color: var(--muted); font-size: 12.5px; font-weight: 400; }
.switch i { width: 42px; height: 25px; border-radius: 13px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; border-radius: 50%; background: var(--text); transition: transform .2s; }
.switch[aria-checked="true"] i { background: var(--fresh); } .switch[aria-checked="true"] i::after { transform: translateX(17px); }
.flash { animation: flash .8s ease; }
@keyframes flash { 0% { background: rgba(95,214,196,.35); border-radius: 6px; } 100% { background: transparent; } }
.benefits { display: grid; gap: 10px; } .benefits > div { display: flex; gap: 12px; align-items: center; font-weight: 600; font-size: 15px; }
.benefits .sub, .wait .sub { display: block; color: var(--muted); font-size: 13px; font-weight: 400; }
.code { border: 0; color: var(--text); cursor: pointer; width: 100%; }
.wait { display: flex; gap: 12px; align-items: center; background: var(--panel); border-radius: 14px; padding: 12px; font-size: 14px; }
.spin { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--fresh); animation: rot 1s linear infinite; flex: none; }
@keyframes rot { to { transform: rotate(360deg); } }
.flow { display: flex; align-items: center; gap: 6px; } .flow span { flex: 1; background: var(--panel); border-radius: 12px; padding: 10px 8px; font-size: 11.5px; color: var(--muted); text-align: center; }
.flow b { display: block; color: var(--text); font: 700 13px var(--display); } .flow i { color: var(--fresh); font-style: normal; }
.plats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.plats button { background: var(--raised); color: var(--text); border: 1.5px solid transparent; border-radius: 14px; padding: 14px 10px; font: 600 14px var(--display); cursor: pointer; }
.plats button[aria-pressed="true"] { border-color: var(--fresh); color: var(--fresh); }
.choice.big { padding: 18px 14px; font-size: 16px; font-weight: 600; } .bflag { font-size: 26px; }
.flag.big { font-size: 15px; padding: 8px 14px; }
.ver { border: 1.5px solid transparent; color: var(--text); font-family: var(--sans); text-align: left; cursor: pointer; width: 100%; }
.ver.best { padding: 16px 12px; } .ver.on { border-color: var(--fresh); background: rgba(95,214,196,.08); }
.choice.on .tick { animation: pop .35s ease; } @keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.2); } 100% { transform: none; } }
.nudge .x { background: none; color: var(--muted); padding: 4px 6px; font-size: 16px; }
.btn svg { width: 16px; height: 16px; vertical-align: -3px; }
@media (prefers-reduced-motion: reduce) { .flash, .spin, .choice.on .tick { animation: none; } }
.link { background: none; border: 0; color: var(--fresh); font: inherit; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.subline { display: flex; gap: 10px; align-items: center; text-align: left; background: var(--panel); border: 0; color: var(--text); border-radius: 14px; padding: 11px 14px; font: 500 14px var(--sans); cursor: pointer; width: 100%; }
.subline .grow { flex: 1; } .subline .sub { display: block; color: var(--muted); font-size: 12px; font-weight: 400; } .subline .link { text-decoration: none; font-weight: 600; }
.langseg.wrap button { flex: 1 0 30%; }
.playbtn { display: flex; align-items: stretch; border-radius: 999px; overflow: hidden; background: var(--fresh); color: var(--ink); font: 700 15px var(--sans); }
.playbtn span { flex: 1; padding: 11px 14px; } .pflag small { font: 600 12px var(--sans); }
.pflag { background: rgba(0,0,0,.14); border: 0; font-size: 20px; padding: 0 14px; cursor: pointer; animation: nudgeflag 1.6s ease 2; }
@keyframes nudgeflag { 50% { transform: scale(1.18); } }
.stars5 { display: flex; gap: 4px; } .stars5 button { background: none; border: 0; font-size: 30px; color: var(--line); cursor: pointer; padding: 0 2px; } .stars5 button.on { color: var(--warm); }
.remote { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 8px; margin-top: auto; } .remote button { background: var(--raised); color: var(--text); border: 0; border-radius: 16px; padding: 16px 8px; font: 600 14px var(--sans); cursor: pointer; } .remote .mainr { background: var(--text); color: var(--ink); }
.keybox { display: flex; align-items: center; gap: 8px; background: var(--raised); border-radius: 14px; padding: 8px 8px 8px 14px; color: var(--muted); font-size: 14px; } .keybox span { flex: 1; } .keybox button { background: var(--text); color: var(--ink); border: 0; border-radius: 999px; padding: 7px 12px; font: 600 12.5px var(--sans); cursor: pointer; }
.tvpill { display: inline-flex; gap: 5px; align-items: center; background: rgba(95,214,196,.13); color: var(--fresh); border-radius: 999px; padding: 4px 9px; font-size: 11.5px; font-weight: 600; } .tvpill svg { width: 13px; height: 13px; }
@media (prefers-reduced-motion: reduce) { .pflag { animation: none; } }
.ask { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; font-size: 13.5px; display: grid; gap: 6px; } .ask .row2 { display: flex; gap: 8px; } .ask .btn { padding: 9px 14px; font-size: 13.5px; }
.pins { display: flex; gap: 10px; justify-content: center; background: none; border: 0; cursor: pointer; } .pins span { width: 52px; height: 62px; border-radius: 14px; background: var(--raised); border: 1.5px solid var(--line); display: grid; place-items: center; font: 700 28px var(--display); color: var(--text); }
.player.big { aspect-ratio: 16/10; } .playing { position: absolute; inset: 0; display: grid; place-items: center; font-size: 40px; color: rgba(255,255,255,.85); }
.welcome-lang { display: grid; gap: 6px; justify-items: center; position: relative; z-index: 2; }
.welcome-lang + .orbit { margin: 46px 0 40px; }
.ipad .welcome-lang + .orbit { margin: 40px 0 0; }
.langseg.pill { background: var(--panel); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: nowrap; width: 220px; }
.langseg.pill button { border-radius: 999px; padding: 7px 10px; border: 0; background: none; color: var(--muted); }
.langseg.pill button[aria-pressed="true"] { background: var(--text); color: var(--ink); }
.dubline { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.inl { background: var(--panel); color: var(--fresh); border: 1.5px solid var(--fresh); border-radius: 10px; padding: 5px 8px; font: 600 15px var(--sans); }
.err { background: rgba(240,120,90,.12); color: #ffb39e; border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
</style>

<div class="wrap">
  <header>
    <h1>Prototipo de la guía de Orbital</h1>
    <p class="lede">Se toca como la app. Arriba eliges la versión y la pantalla; a la derecha está qué decisión hay detrás de cada paso. Es para probar el orden y las palabras, no el diseño final de cada pantalla.</p>
  </header>
  <div class="bar">
    <span class="seglabel">Versión</span>

      <div><span class="ico">${ICON.bell}</span><span>Te avisa de estrenos<span class="sub">De las series que sigues</span></span></div>
      <div><span class="ico">${ICON.devices}</span><span>Te sigue a todos lados<span class="sub">${devices}</span></span></div></div></div>
      <div class="col">${acts}</div></div>`;
  },
  win() {
    const deck = cards => `<div class="deck">${cards.map(c => `<button class="card ${S.saved.includes(c[0]) ? "on" : ""}" data-a="save" data-v="${c[0]}">${poster(c[0])}<span class="why">${c[1]}</span></button>`).join("")}</div>`;
    const last = S.saved.length ? `<div class="toast">✓ ${POSTERS[S.saved[S.saved.length - 1]][0]} quedó en Mi lista</div>` : "";
    if (S.trakt && !S.traktNew) return `${head()}<div class="body"><span class="ico">✓</span><h2 class="t">Trajimos lo tuyo</h2>
      <p class="s">Lo que viste, tu lista y tus calificaciones ya están aquí. Esto es para ti; toca una para guardarla.</p>
      <div class="row-title"><small>Porque viste Shōgun</small>Para esta noche</div>
      ${deck([["arrival", "Ciencia ficción pausada"], ["interstellar", "Del director de El origen"], ["br2049", "Otro mundo enorme, como Shōgun"]])}
      ${last}<div class="actions" style="margin-top:auto"><button class="btn p" data-a="next">Continuar</button></div></div>`;
    const sets = [[["arrival", "Lo más visto de la semana"], ["bear", "Corta: episodios de 30 min"], ["chern", "De las mejor calificadas"]],
                  [["severance", "Para maratonear"], ["matrix", "Un clásico que vale la pena"], ["origin", "Menos de 2 h y media"]]];
    const title = S.traktNew ? "Tu Trakt ya está conectado. Empecemos a llenarlo" : "Decide por mí";
    return `${head()}<div class="body"><span class="ico">${ICON.dice}</span><h2 class="t">${title}</h2>
      <p class="s">Tres opciones para esta noche, cada una con su porqué. Toca la que se te antoje y la guardamos.</p>
      ${deck(sets[S.shuffled ? 1 : 0])}
      ${last || '<button class="btn q" data-a="shuffle">Otras tres</button>'}
      <div class="actions" style="margin-top:auto"><button class="btn ${S.saved.length ? "p" : "g"}" data-a="next">${S.saved.length ? "Continuar" : "Ahora no"}</button></div></div>`;
  },
  platforms() {
    return `${head()}<div class="body two"><div class="col"><span class="ico">${ICON.tv}</span><h2 class="t">¿Qué plataformas tienes?</h2>
      <p class="s">Así te decimos qué puedes ver sin pagar más, y lo nuevo en lo tuyo.</p></div>
      <div class="col"><div class="plats">${PLATFORMS.map(p => `<button data-a="plat" data-v="${p}" aria-pressed="${S.platforms.includes(p)}">${p}</button>`).join("")}${S.platforms.filter(p => !PLATFORMS.includes(p)).map(p => `<button data-a="plat" data-v="${p}" aria-pressed="true">${p}</button>`).join("")}<button data-a="sheet" data-v="moreplat" style="grid-column:1/-1">Otra…</button></div>
      <p class="small">Solo se guarda en Orbital. Lo cambias en Ajustes.</p>
      <div class="actions"><button class="btn ${S.platforms.length ? "p" : "g"}" data-a="next">${S.platforms.length ? "Continuar" : "Ahora no"}</button></div></div></div>`;
  },
  cloud() {
    const flow = `<div class="flow"><span><b>Orbital</b>busca y elige</span><i>→</i><span><b>Tu servicio</b>la tiene lista</span><i>→</i><span><b>Tu pantalla</b>la reproduce</span></div>`;
    const acts = S.cloud
      ? `<div class="toast">✓ ${S.cloud} conectado. Ya puedes ver aquí.</div><div class="actions"><button class="btn p" data-a="next">Continuar</button><button class="btn q" data-a="sheet" data-v="clouds">Cambiar</button></div>`
      : `<div class="actions"><button class="btn p" data-a="sheet" data-v="clouds">Ya tengo uno</button><button class="btn g" data-a="sheet" data-v="none">Aún no tengo</button><button class="btn q" data-a="nocloud">Ahora no</button></div>`;
    return `${head()}<div class="body two"><div class="col"><span class="ico">${ICON.cloud}</span><h2 class="t">Para ver aquí, conecta un servicio de nube</h2>
      <p class="s">Es aparte de Orbital: guarda las películas y las tiene listas para ti. <button class="link" data-a="sheet" data-v="how">¿Cómo funciona?</button></p>${flow}
      <div class="facts"><div class="fact"><span class="ico">${ICON.card}</span><div><b>Se paga en su página</b><span>Orbital no cobra nada.</span></div></div>
      <div class="fact"><span class="ico">${ICON.user}</span><div><b>Una cuenta por persona</b><span>Si dos la usan a la vez, se corta.</span></div></div></div></div>
      <div class="col">${acts}</div></div>`;
  },
  how() {
    const big = (v, flag, inner, sub) => `<div class="choice big ${S.listen === v ? "on" : ""}" data-a="listen" data-v="${v}" role="button" tabindex="0"><span class="bflag">${flag}</span><span class="grow">${inner}<span class="sub">${sub}</span></span><span class="tick">${S.listen === v ? "✓" : ""}</span></div>`;
    const dubSel = `<select id="dubpick" class="inl" aria-label="Idioma del doblaje">${DUBS.map(id => `<option value="${id}" ${S.dub === id ? "selected" : ""}>${lname(id)}</option>`).join("")}</select>`;
    const rows = S.langs.map((id, i) => `<div class="lrow"><span class="rank">${i + 1}</span><span class="grow">${LANGS[id][0]}<span class="sub">${LANGS[id][1]}</span></span>
      <button class="mini" data-a="up" data-v="${i}" aria-label="Subir" ${i === 0 ? "disabled" : ""}>↑</button><button class="mini" data-a="down" data-v="${i}" aria-label="Bajar" ${i === S.langs.length - 1 ? "disabled" : ""}>↓</button><button class="mini" data-a="drop" data-v="${i}" aria-label="Quitar" ${S.langs.length === 1 ? "disabled" : ""}>×</button></div>`).join("");
    const left = Object.keys(LANGS).filter(id => !S.langs.includes(id));
    const options = `<option value="">Agregar un idioma…</option><optgroup label="Los más usados">${left.filter(id => LANGS[id][2]).map(id => `<option value="${id}">${LANGS[id][0]}</option>`).join("")}</optgroup><optgroup label="Todos">${left.filter(id => !LANGS[id][2]).map(id => `<option value="${id}">${LANGS[id][0]}</option>`).join("")}</optgroup>`;
    const order = S.showOrder ? `<div class="list">${rows}</div><select class="pick" id="addlang" aria-label="Agregar un idioma">${options}</select><p class="small">«Ver» busca una versión en el primero; si no hay, en el siguiente.</p>` : "";
    const subs = S.subsOpen ? `<div class="langseg wrap">${SUBS.map(k => `<button data-a="subs" data-v="${k}" aria-pressed="${S.subs === k}">${sub1(SUBNAMES[k])}</button>`).join("")}</div>` : "";
    return `${head()}<div class="body two"><div class="col"><span class="ico">${ICON.ear}</span><h2 class="t">¿En qué idioma quieres oír películas y series?</h2>
      <p class="s">Cada una viene en varias versiones y cada versión suena en su idioma. Dinos cuál prefieres y «Ver» la elige por ti.</p></div>
      <div class="col">${big("dub", LANGS[S.dub][3], `<span class="dubline">En ${dubSel}</span>`, "Doblada cuando exista; si no, en su idioma con subtítulos")}
      ${big("orig", "🎬", "En su idioma, con subtítulos", "Como se filmó")}
      <button class="subline" data-a="subsopen"><span class="grow">Subtítulos en ${SUBNAMES[S.subs]}<span class="sub">Solo salen cuando no suena en tu idioma</span></span><span class="link">${S.subsOpen ? "Listo" : "Cambiar"}</span></button>${subs}
      <button class="btn q" data-a="order" style="justify-self:start">${S.showOrder ? "Ocultar el orden" : "Más de un idioma ›"}</button>${order}
      <div class="actions"><button class="btn p" data-a="next">Continuar</button></div></div></div>`;
  },
  tour() {
    if (S.tour === "versions") {
      const first = S.langs[0];
      const firstName = first === "original" ? `Inglés (original), subtítulos en ${SUBNAMES[S.subs]}` : lname(first);
      const shortName = first === "original" ? "Original" : lname(first).replace("Español ", "").replace(/^./, c => c.toUpperCase());
      const flag0 = first === "original" ? "🎬" : LANGS[first][3];
      const VERS = [[flag0, firstName, first === "original" ? "4K" : "1080p", "⚡", first === "latino" ? "Latino comprobado · lista al instante" : "Tu idioma · lista al instante"],
                    ["🇺🇸", "Inglés", "4K", "⚡", "Mejor imagen, pesa más"],
                    ["🇪🇸", "Castellano", "1080p", "Pedir", "Hay que pedirla: unos minutos"]];
      if (first !== "latino") VERS[1] = (first === "en" || first === "original") ? ["🇲🇽", "Español latino", "1080p", "⚡", "Doblada"] : ["🇺🇸", "Inglés", "4K", "⚡", "Mejor imagen, pesa más"];
      if (first === "castellano") VERS[2] = ["🇲🇽", "Español latino", "1080p", "Pedir", "Hay que pedirla: unos minutos"];
      const cur = VERS[S.ver];
      if (!S.verOpen) return `${head()}<div class="body"><h2 class="t">«Ver» ya eligió por ti</h2>
        <p class="s">El botón dice en qué idioma va a sonar. ¿Quieres otra versión? Toca el idioma.</p>
        <div class="lists-demo"><div style="width:36%">${poster("dune")}</div><div style="flex:1;display:grid;gap:8px;align-content:start"><b class="pv-title">Duna: Parte dos</b><span class="pv-kind">Película · 2024</span>
        <div class="playbtn"><span>▶ Ver</span><button class="pflag" data-a="veropen" aria-label="Cambiar versión">${flag0} <small>${shortName}</small></button></div>
        <div class="tip"><b>¿Otra?</b>Toca el idioma, junto a «Ver».</div></div></div></div>`;
      const pend = !S.requested ? "" : S.notif == null
        ? `<div class="ask"><b>La pedimos a tu servicio de nube.</b> Mientras, sigue en ${VERS[0][1].toLowerCase().split(" ·")[0]}. ¿Te avisamos cuando esté lista?<span class="small">Orbital solo te avisa de lo tuyo: versiones pedidas y estrenos de tus series.</span><div class="row2"><button class="btn p" data-a="notif" data-v="yes">Sí, avísame</button><button class="btn q" data-a="notif" data-v="no">Ahora no</button></div></div>`
        : `<div class="toast">${S.notif ? "✓ Te avisamos cuando esté lista." : "Va. La verás en la ficha cuando esté lista."} Mientras, sigue en ${VERS[0][1].toLowerCase().split(" ·")[0]}.</div>`;
      const changed = S.ver ? `<div class="toast">Listo: ahora suena en ${cur[1].toLowerCase()}. La próxima vez, «Ver» vuelve a elegir por ti.</div>` : "";
      return `${head()}<div class="body"><h2 class="t">Elige otra versión</h2>
        <p class="s">Cada versión cambia el idioma o la calidad. La ✦ es la que «Ver» eligió para ti.</p>
        <div class="player"><span class="flag big${f("ver")}">${cur[0]} ${cur[1]} · ${cur[2]}</span></div>
        <div class="list">${VERS.map((v, i) => `<button class="ver ${i === 0 ? "best" : ""} ${S.ver === i ? "on" : ""}" data-a="pickver" data-v="${i}"><span>${i === 0 ? "✦" : ""}</span><span>${v[0]} ${v[1]} · ${v[2]}</span><span class="meta">${v[3]}</span><span class="reason"${i ? ' style="color:var(--muted)"' : ""}>${v[4]}</span></button>`).join("")}</div>
        <p class="small">⚡ lista al instante · Pedir: tarda unos minutos</p>${changed}${pend}
        <div class="actions" style="margin-top:auto"><button class="btn ${S.ver || S.requested ? "p" : "g"}" data-a="taskdone" data-v="versions">${S.ver || S.requested ? "Entendido" : "Me quedo con esta"}</button></div></div>`;
    }
    if (S.tour === "decide") return `${head()}<div class="body"><span class="ico">${ICON.dice}</span><h2 class="t">Decide por mí</h2><p class="s">Cuando no sepas qué ver: tres opciones con su porqué. Toca una para guardarla.</p>
      <div class="deck">${[["shogun", S.trakt && !S.traktNew ? "Porque viste Severance" : "La más comentada"], ["matrix", "Un clásico que vale la pena"], ["origin", "Menos de 2 h y media"]].map(c => `<button class="card" data-a="tourpick" data-v="${c[0]}">${poster(c[0])}<span class="why">${c[1]}</span></button>`).join("")}</div><p class="small">Vive en Inicio y en Explorar.</p></div>`;
    if (S.tour === "seen") return `${head()}<div class="body"><span class="ico">★</span><h2 class="t">Ya la vi</h2><p class="s">Toca las estrellas: con eso Orbital te conoce${S.trakt ? " y se guarda en tu Trakt" : ""}.</p>
      <div class="lists-demo"><div style="width:38%">${poster("matrix")}</div><div style="flex:1;display:grid;gap:10px;align-content:start"><b class="pv-title">Matrix</b><span class="pv-kind">Película · 1999</span>
      <div class="stars5">${[1, 2, 3, 4, 5].map(n => `<button data-a="rate" data-v="${n}" aria-label="${n} estrellas" class="${n <= S.rated ? "on" : ""}">★</button>`).join("")}</div><button class="btn q" data-a="notseen" style="justify-self:start;padding:4px 0">No la he visto</button></div></div></div>`;
    if (S.tour === "follow") return `${head()}<div class="body"><span class="ico">${ICON.tv}</span><h2 class="t">Tus series, al día</h2><p class="s">«Seguir viendo» te deja en el episodio donde ibas, y te avisamos cuando sale el siguiente. Toca «Seguir».</p>
      <div class="nudge"><span class="ico">▶</span><span class="grow">Shōgun<span class="sub" style="display:block;color:var(--muted)">T1 E7 · donde te quedaste</span></span><button data-a="taskdone" data-v="follow">Seguir</button></div></div>`;
    if (S.tour === "lists") return `${head()}<div class="body"><span class="ico">${ICON.plus}</span><h2 class="t">Tus listas</h2><p class="s">El + la guarda en Mi lista, o en una lista que tú armes. Toca «Mi lista».${S.trakt ? " Se guarda también en tu Trakt." : ""}</p>
      <div class="lists-demo"><div style="width:38%">${poster("interstellar")}</div><div class="list" style="flex:1">
        <button class="choice" data-a="taskdone" data-v="lists"><span class="grow">Mi lista</span><span class="tick"></span></button>
        <div class="choice"><span class="grow">Nueva lista…<span class="sub">Por ejemplo, «Para ver con mi familia»</span></span></div></div></div></div>`;
    if (S.tour === "where") {
      const mine = S.platforms[0];
      const rows = (mine ? [[mine, "Incluida en tu plan"]] : [["Netflix", "Con suscripción"]]).concat([["Apple TV", "Renta o compra"]]);
      const target = mine ? `a ${S.platforms.length > 1 ? "tus plataformas" : mine}` : "a mis plataformas";
      return `${head()}<div class="body"><span class="ico">${ICON.globe}</span><h2 class="t">Dónde verla</h2><p class="s">Cada ficha te dice en qué plataformas está en tu país${mine ? ", con las tuyas arriba," : ""} y te lleva directo. Toca una.</p>
      <div class="list">${rows.map(r => `<button class="choice" data-a="taskdone" data-v="where"><span class="grow">${r[0]}<span class="sub">${r[1]}</span></span><span>↗</span></button>`).join("")}</div>
      <div class="row-title" style="margin-top:6px"><small>Otra ficha</small>Severance</div>
      <div class="choice"><span class="grow">Solo en renta o compra<span class="sub">${mine ? "No está en las tuyas" : "Ninguna con suscripción"}</span></span></div>
      ${S.whenAsk ? `<div class="ask"><b>¿Te avisamos cuando llegue ${target}?</b><span class="small">Orbital solo te avisa de lo tuyo.</span><div class="row2"><button class="btn p" data-a="taskdone" data-v="whennotify">Sí, avísame</button><button class="btn q" data-a="taskdone" data-v="where">Ahora no</button></div></div>`
        : `<button class="btn g" data-a="${mine ? "whenask" : "sheet"}" data-v="${mine ? "" : "pickplats"}">🔔 Avísame cuando llegue ${target}</button>`}</div>`;
    }
    if (S.tour === "tvsend") return `${head()}<div class="body"><span class="ico">${ICON.tv}</span><h2 class="t">Mándala a la TV</h2>
      <p class="s">${S.remote ? `Ya se ve en tu TV, y tu ${here()} es el control. Toca «Pausa».` : "En cualquier ficha, este botón la abre en tu TV."}</p>
      <div class="player"><span class="flag">${S.remote ? "En tu TV · " : ""}Duna: Parte dos</span></div>
      ${S.remote ? `<div class="remote"><button data-a="noop">−10 s</button><button class="mainr" data-a="taskdone" data-v="tvsend">❚❚ Pausa</button><button data-a="noop">+10 s</button></div>`
        : `<div class="actions" style="margin-top:auto"><button class="btn p" data-a="remote">${ICON.tv} Ver en la TV</button></div>`}</div>`;
    const all = {
      versions: [ICON.play, "Cambia de versión", "Otro idioma u otra calidad"],
      decide: [ICON.dice, "Decide por mí", "Tres opciones con su porqué"],
      follow: [ICON.tv, "Tus series, al día", "Sigue donde te quedaste"],
      seen: ["★", "Ya la vi", "Califícala con un toque"],
      lists: [ICON.plus, "Guarda en tus listas", "Mi lista y las tuyas"],
      where: [ICON.globe, "Dónde verla", "En qué plataforma está"],
      tvsend: [ICON.tv, "Mándala a la TV", `Tu ${here()} es el control`]
    };
    const canWatch = watches() && S.cloud;
    const first = canWatch ? "versions" : !watches() ? "where" : S.decidedInWin ? "follow" : "decide";
    const ids = [first, "seen", "lists"];
    if (edition === "ultra" && S.tv && canWatch) ids.push("tvsend");
    const done = ids.every(id => S.tasks[id]);
    const n = ids.length === 4 ? "Cuatro" : "Tres";
    return `${head()}<div class="body two"><div class="col"><h2 class="t">Prueba lo principal</h2><p class="s">${n} toques, menos de un minuto.</p></div>
      <div class="col"><div class="tasks">${ids.map(id => `<button class="choice ${S.tasks[id] ? "on" : ""}" data-a="tour" data-v="${id}"><span class="ico">${all[id][0]}</span><span class="grow">${all[id][1]}<span class="sub">${all[id][2]}</span></span><span class="tick">${S.tasks[id] ? "✓" : ""}</span></button>`).join("")}</div>
      ${toast()}<p class="small">Buscar, los filtros${first === "follow" ? "" : " y tus series al día"} te los enseñamos la primera vez que entres.</p>
      <div class="actions">${canWatch ? `<button class="btn p" data-a="playnow">▶ Ver algo ahora</button><button class="btn q" data-a="next">Ir a Inicio</button>` : `<button class="btn ${done ? "p" : "g"}" data-a="next">Ir a Inicio</button>`}</div></div></div>`;
  },
  playing() {
    const first = S.langs[0];
    const name = first === "original" ? `Inglés (original) · subtítulos en ${SUBNAMES[S.subs]}` : lname(first);
    return `<div class="top"></div><div class="body"><div class="player big"><span class="playing">▶</span><span class="flag big">${first === "original" ? "🎬" : LANGS[first][3]} ${name} · ⚡</span></div>
      <h2 class="t">Duna: Parte dos</h2><p class="s">Arrancó al instante, en tu idioma, con la versión que «Ver» eligió. Esto es Orbital.</p>
      ${S.tv ? `<button class="btn g" data-a="noop">${ICON.tv} Pasarla a la TV</button>` : ""}
      <div class="actions" style="margin-top:auto"><button class="btn p" data-a="tohome">Ir a Inicio</button></div></div>`;
  },
  home() {
    const all = [];
    if (!S.trakt) all.push(["trakt", ICON.trakt, "Guarda lo tuyo en todos tus aparatos", "Conectar Trakt"]);
    if (watches() && !S.cloud) all.push(["cloud", ICON.cloud, S.cloudLater ? "¿Ya tienes tu servicio de nube?" : "Conecta tu servicio de nube para ver aquí", "Conectar"]);
    if (edition === "ultra" && !S.tv && !S.noTV) all.push(["tv", ICON.tv, `Usa tu ${here()} como control de Orbital en la TV`, "Conectar"]);
    const nudge = all.find(n => !S.dismissed.includes(n[0]));
    const card = nudge ? `<div class="nudge"><span class="ico">${nudge[1]}</span><span class="grow">${nudge[2]}</span><button data-a="nudge" data-v="${nudge[0]}">${nudge[3]}</button><button class="x" data-a="dismiss" data-v="${nudge[0]}" aria-label="Cerrar">×</button></div>` : "";
    const saved = S.saved;
    const mine = !watches() && S.platforms.length;
    const ready = watches() && S.cloud ? `<div class="row-title"><small>⚡ Listas al instante en tu idioma</small>Para ver ya</div><div class="shelf">${["dune", "arrival", "br2049", "origin", "matrix"].map(k => poster(k)).join("")}</div>` : "";
    return `<div class="top"></div><div class="body"><div class="home-head"><span class="logo">orbital</span>${S.tv ? `<span class="tvpill">${ICON.tv} En la TV · conectada</span>` : ""}<span class="avatar" title="Ajustes (ahí vive Aprende)"></span></div>
      ${S.watched ? `<div class="row-title"><small>Donde te quedaste</small>Seguir viendo</div><div class="nudge"><span class="ico">▶</span><span class="grow">Duna: Parte dos<span class="sub" style="display:block;color:var(--muted)">Te quedaste al principio</span></span><button data-a="noop">Seguir</button></div>` : ""}
      ${S.trakt && !S.traktNew ? `${S.watched ? "" : `<div class="row-title"><small>Donde te quedaste</small>Seguir viendo</div>`}<div class="nudge"><span class="ico">▶</span><span class="grow">Shōgun<span class="sub" style="display:block;color:var(--muted)">T1 E7 · el siguiente episodio</span></span><button data-a="noop">${watches() && S.cloud ? "Ver" : "Marcar visto"}</button></div>` : ""}
      ${saved.length ? `<div class="row-title"><small>Lo que guardaste</small>Mi lista</div><div class="shelf">${saved.map(k => poster(k)).join("")}</div>` : ""}
      ${card}${ready}
      <div class="row-title"><small>${S.trakt && !S.traktNew ? "Porque viste Shōgun" : saved.length ? `Porque guardaste ${POSTERS[saved[0]][0]}` : "Lo popular de ahora"}</small>Para esta noche</div>
      <div class="shelf">${["br2049", "dune", "arrival", "matrix", "origin"].map(k => poster(k)).join("")}</div>
      <div class="row-title"><small>${mine ? "En tus plataformas" : "Lo que se estrena"}</small>Nuevo esta semana</div>
      <div class="shelf">${["severance", "bear", "shogun", "chern", "interstellar"].map(k => poster(k)).join("")}</div></div>`;
  }
};

const META = {
  es: { title: "Duna: Parte dos", line: "Paul Atreides se une a los Fremen para vengar a su familia.", kind: "Película · 2024 · 2 h 46 min" },
  en: { title: "Dune: Part Two", line: "Paul Atreides unites with the Fremen to avenge his family.", kind: "Movie · 2024 · 2 h 46 min" },
  pt: { title: "Duna: Parte Dois", line: "Paul Atreides se une aos Fremen para vingar sua família.", kind: "Filme · 2024 · 2 h 46 min" }
};
const UIW = { es: { tabs: ["Inicio", "Explorar", "Biblioteca", "Buscar"], btn: "Ver" }, en: { tabs: ["Home", "Explore", "Library", "Search"], btn: "Play" } };
const SHEETS = {
  meta: () => { const m = META[S.splitMeta ? S.metaLang : S.uiLang], ui = UIW[S.uiLang], en = S.uiLang === "en";
    return `<div class="sheet-head"><b>${en ? "Titles and synopses" : "Títulos y sinopsis"}</b><button class="btn q" data-a="sheet" data-v="">${en ? "Done" : "Listo"}</button></div>
    <div class="preview"><div class="pv-poster" style="background:${POSTERS.dune[1]}"></div>
      <div class="pv-body"><b class="pv-title${f("meta")}">${m.title}</b><span class="pv-kind${f("meta")}">${m.kind}</span><span class="pv-line${f("meta")}">${m.line}</span><span class="pv-btn">▶ ${ui.btn}</span></div>
      <div class="pv-tabs">${ui.tabs.map((t, i) => `<span class="${i === 0 ? "on" : ""}">${t}</span>`).join("")}</div></div>
    <button class="switch" data-a="split" role="switch" aria-checked="${S.splitMeta}"><span class="grow">${en ? "In another language" : "En otro idioma"}<span class="sub">${en ? "For example, the app in English and movies in Spanish" : "Por ejemplo, la app en español y las películas en inglés"}</span></span><i></i></button>
    ${S.splitMeta ? `<div class="langseg">${[["es", "Español"], ["en", "English"], ["pt", "Português"]].map(([k, n]) => `<button data-a="meta" data-v="${k}" aria-pressed="${S.metaLang === k}">${n}</button>`).join("")}</div>` : ""}
    <p class="small">${en ? "Change it anytime in Settings › Languages." : "Lo cambias cuando quieras en Ajustes › Idiomas."}</p>`; },
  pickplats: () => `<div class="sheet-head"><b>¿Qué plataformas tienes?</b><button class="btn q" data-a="sheet" data-v="">Cerrar</button></div>
    <p class="s">Así sabemos cuándo avisarte.</p>
    <div class="plats">${PLATFORMS.map(p => `<button data-a="plat" data-v="${p}" aria-pressed="${S.platforms.includes(p)}">${p}</button>`).join("")}</div>
    <button class="btn ${S.platforms.length ? "p" : "g"}" data-a="${S.platforms.length ? "platsdone" : "noop"}">Listo</button>`,
  moreplat: () => `<div class="sheet-head"><b>Otra plataforma</b><button class="btn q" data-a="sheet" data-v="">Listo</button></div>
    <div class="searchbox">⌕ Busca tu plataforma</div>
    <div class="plats">${["Crunchyroll", "Pluto TV", "Claro video", "Tubi", "MGM+", "Plex", "BritBox", "Filmin"].map(p => `<button data-a="plat" data-v="${p}" aria-pressed="${S.platforms.includes(p)}">${p}</button>`).join("")}</div>`,
  clouds: () => `<div class="sheet-head"><b>¿Cuál tienes?</b><button class="btn q" data-a="sheet" data-v="">Cerrar</button></div>
    <div class="list">${["Real-Debrid", "TorBox", "AllDebrid"].map(c =>
      `<button class="choice" data-a="keyfor" data-v="${c}"><span class="ico">${ICON.cloud}</span><span class="grow">${c}<span class="sub">${svc(c)}</span></span><span>›</span></button>`).join("")}</div>`,
  key: () => S.keyFor === "Real-Debrid"
    ? `<div class="sheet-head"><b>Conecta Real-Debrid</b><button class="btn q" data-a="sheet" data-v="clouds">Atrás</button></div>
      <p class="s">Abre real-debrid.com/device y escribe este código.</p>${S.failed.rd === 1 && !S.rdWait ? `<div class="err">Ese código venció. Ya te dimos uno nuevo: vuelve a escribirlo en Real-Debrid.</div>` : ""}<div class="code">${S.failed.rd ? "Q9 3T 8V" : "K4 7P 2M"}</div>
      ${S.rdWait ? `<div class="wait"><span class="spin"></span><span>Esperando a que lo apruebes en Real-Debrid…<span class="sub">Cuando lo apruebes, seguimos solos.</span></span></div><button class="btn g" data-a="rdcheck">¿Ya lo aprobaste? Revisar ahora</button>` : '<button class="btn p" data-a="rdwait">Copiar y abrir Real-Debrid</button>'}<p class="small">En el prototipo, a los cuatro segundos simula que ya lo aprobaste.</p>`
    : `<div class="sheet-head"><b>Conecta ${S.keyFor}</b><button class="btn q" data-a="sheet" data-v="clouds">Atrás</button></div>
      <div class="facts"><div class="fact"><span class="ico">1</span><div><b>Entra a tu cuenta</b><span>En la página de ${S.keyFor}.</span></div></div>
      <div class="fact"><span class="ico">2</span><div><b>Busca «API» o «Clave»</b><span>Está en los ajustes de tu cuenta.</span></div></div>
      <div class="fact"><span class="ico">3</span><div><b>Cópiala y vuelve</b><span>La pegas aquí abajo.</span></div></div></div>
      <button class="btn g" data-a="noop">¿Dónde está mi clave? Abrir su página ↗</button>
      <div class="keybox"><span>${S.keyPasted ? "••••••••••••••••" : "Tu clave"}</span><button data-a="paste">Pegar</button></div>
      ${S.failed.key === 1 ? `<div class="err">${S.keyFor === "AllDebrid" ? "Tu cuenta de AllDebrid no tiene un plan activo. Renuévalo en su página y vuelve a intentarlo." : "Esa clave no funcionó. Revisa que la copiaste completa, sin espacios, y pégala otra vez."}</div>` : ""}
      <button class="btn ${S.keyPasted ? "p" : "g"}" data-a="${S.keyPasted ? "keycheck" : "noop"}">Conectar</button>`,
  none: () => `<div class="sheet-head"><b>Aún no tienes uno</b><button class="btn q" data-a="sheet" data-v="">Cerrar</button></div>
    <p class="s">Hay tres y hacen lo mismo. Se contrata en su página y puedes cambiar después.</p>
    <div class="list">${[["Real-Debrid", "Sugerido: se conecta con un código, sin copiar claves"], ["TorBox", "Se conecta con tu clave"], ["AllDebrid", "Se conecta con tu clave"]].map((c, i) => `<button class="choice ${i ? "" : "on"}" data-a="noop"><span class="ico">${ICON.cloud}</span><span class="grow">${c[0]}<span class="sub">${c[1]}</span></span><span class="small">Abrir ↗</span></button>`).join("")}</div>
    <button class="btn p" data-a="sheet" data-v="clouds">Ya lo contraté, conectar</button>
    <button class="btn q" data-a="later">Seguir sin él por ahora</button>
    <p class="small">Te lo recordamos en Inicio. Mientras, Orbital ya te sirve para descubrir y guardar.</p>`,
  how: () => `<div class="sheet-head"><b>¿Cómo funciona?</b><button class="btn q" data-a="sheet" data-v="">Cerrar</button></div>
    <div class="facts"><div class="fact"><span class="ico">${ICON.cloud}</span><div><b>Tu servicio de nube guarda las películas</b><span>En sus servidores. Lo que ya tiene arranca al instante; lo que no, se lo pides y lo baja en minutos.</span></div></div>
    <div class="fact"><span class="ico">${ICON.bolt}</span><div><b>Orbital busca en toda la red</b><span>Encuentra varias versiones de lo que quieres ver y le pide a tu servicio la mejor para ti.</span></div></div>
    <div class="fact"><span class="ico">${ICON.card}</span><div><b>Hay tres, y hacen lo mismo</b><span>Real-Debrid, TorBox y AllDebrid. Cada uno se paga en su página.</span></div></div></div>
    <p class="small">Lo técnico vive en Ajustes › Aprende.</p>`,
  tvcode: () => {
    if (S.tvSearch === "found") return `<div class="sheet-head"><b>Conecta tu TV</b><button class="btn q" data-a="sheet" data-v="">Cerrar</button></div>
      <div class="choice on"><span class="ico">${ICON.tv}</span><span class="grow">Orbital en tu TV<span class="sub">En esta red de casa</span></span></div>
      <button class="btn p" data-a="tvok">Conectar</button><button class="btn q" data-a="tvsearch" data-v="code">No es la mía: usar un código</button>`;
    if (S.tvSearch === "code") return `<div class="sheet-head"><b>Conecta con un código</b><button class="btn q" data-a="sheet" data-v="">Cerrar</button></div>
      <p class="s">En la TV, abre Ajustes › Conectar un aparato. Ahí aparece un código: escríbelo aquí.</p>
      <button class="pins" data-a="typepin" aria-label="Escribir el código">${(S.pin ? "4812" : "    ").split("").map(d => `<span>${d.trim()}</span>`).join("")}</button>
      ${S.failed.pin === 1 ? `<div class="err">Ese código no coincide con el de tu TV. Revísalo: cambia cada vez que abres esa pantalla.</div>` : ""}
      <button class="btn ${S.pin ? "p" : "g"}" data-a="${S.pin ? "pincheck" : "noop"}">Conectar</button><p class="small">En el prototipo, toca los cuadros para escribirlo.</p>`;
    if (S.tvSearch === "none") return `<div class="sheet-head"><b>No encontramos tu TV</b><button class="btn q" data-a="sheet" data-v="">Cerrar</button></div>
      <div class="err">Revisa que la TV esté prendida con Orbital abierto, y que los dos estén en la misma red de casa.</div>
      <button class="btn p" data-a="tvsearch" data-v="go">Buscar otra vez</button><button class="btn q" data-a="tvsearch" data-v="code">Usar un código</button>`;
    return `<div class="sheet-head"><b>Conecta tu TV</b><button class="btn q" data-a="sheet" data-v="">Cerrar</button></div>
      <div class="wait"><span class="spin"></span><span>Buscando tu TV en esta red de casa…<span class="sub">Ten Orbital abierto en la TV.</span></span></div>`;
  }
};

function render() {
  const el = document.getElementById("screen");
  let html = V[S.step]();
  if (S.sheet) html += `<div class="scrim" data-a="sheet" data-v=""></div><div class="sheet">${SHEETS[S.sheet]()}</div>`;
  el.innerHTML = html;
  S.flash = null;
  const n = NOTES[S.step];
  document.getElementById("notes").innerHTML = `<div class="note"><span class="codes">${n[0]}</span><h2>${n[1]}</h2><p>${n[2]}</p><ul>${n[3].map(x => `<li>${x}</li>`).join("")}</ul></div>
    <div class="note"><span class="codes">El recorrido en ${{ orbital: "Orbital", plus: "Plus", ultra: "Ultra" }[edition]}</span><p>${plan().map(s => s === S.step ? `<b style="color:var(--text)">${NOTES[s][1]}</b>` : NOTES[s][1]).join(" → ")}</p></div>
    <p class="legend">Se enseña en su momento, no aquí: la primera vez en Buscar (filtros), en los subtítulos del reproductor (desfase), cuando algo no está en tu idioma (aviso al arrancar), y todas las historias en Ajustes › Aprende.</p>`;
}

function setListen(v) {
  S.listen = v; const dub = S.dub;
  const rest = S.langs.filter(x => x !== dub && x !== "original");
  S.langs = v === "dub" ? [dub, "original", ...rest] : ["original", dub, ...rest.filter(x => x !== "en")];
}
document.addEventListener("click", e => {
  if (e.target.closest("select")) return;
  const t = e.target.closest("[data-a]"); if (!t) return;
  const a = t.dataset.a, v = t.dataset.v;
  if (a === "next") next();
  else if (a === "back") back();
  else if (a === "skipall") go("home");
  else if (a === "ui") { S.uiLang = v; S.subs = v; S.dub = DUB[v]; if (!S.splitMeta) S.metaLang = v; setListen(S.listen); S.flash = S.splitMeta ? "ui" : "all"; render(); }
  else if (a === "meta") { S.metaLang = v; S.flash = "meta"; render(); }
  else if (a === "split") { S.splitMeta = !S.splitMeta; if (!S.splitMeta) S.metaLang = S.uiLang; render(); }
  else if (a === "sub") { S.traktSub = v || null; S.traktWait = false; S.toast = null; render(); }
  else if (a === "newcode") { S.traktNew = true; S.traktSub = "code"; render(); }
  else if (a === "copy") { S.toast = "copied"; render(); }
  else if (a === "traktok") { S.traktWait = true; render(); setTimeout(approveTrakt, 4000); }
  else if (a === "traktcheck") approveTrakt();
  else if (a === "notrakt") { S.trakt = false; S.traktSub = null; if (S.fromHome) { S.fromHome = false; return go("home"); } go("win"); }
  else if (a === "save") { S.saved.includes(v) ? S.saved.splice(S.saved.indexOf(v), 1) : saveTitle(v); if (!S.trakt || S.traktNew) S.decidedInWin = S.saved.length > 0; render(); }
  else if (a === "shuffle") { S.shuffled = !S.shuffled; render(); }
  else if (a === "plat") { S.platforms.includes(v) ? S.platforms.splice(S.platforms.indexOf(v), 1) : S.platforms.push(v); render(); }
  else if (a === "otherplat") { S.otherPlat = !S.otherPlat; render(); }
  else if (a === "sheet") { S.sheet = v || null; if (v === "tvcode") { S.tvSearch = null; render(); setTimeout(findTV, 1500); return; } render(); }
  else if (a === "keyfor") { S.keyFor = v; S.keyPasted = false; S.rdWait = false; S.sheet = "key"; render(); }
  else if (a === "paste") { S.keyPasted = true; render(); }
  else if (a === "cloudok") { S.cloud = S.keyFor; S.sheet = null; render(); }
  else if (a === "later") { S.cloudLater = true; S.cloud = null; next(); }
  else if (a === "nocloud") { S.cloud = null; next(); }
  else if (a === "listen") { setListen(v); render(); }
  else if (a === "order") { S.showOrder = !S.showOrder; render(); }
  else if (a === "subsopen") { S.subsOpen = !S.subsOpen; render(); }
  else if (a === "subs") { S.subs = v; S.subsOpen = false; render(); }
  else if (a === "tvok") { S.tv = true; S.fromTV = S.step !== "home"; S.trakt = true; S.cloud = S.cloud || (fails ? null : "Real-Debrid"); S.tvNoCloud = !S.cloud; S.sheet = null; render(); }
  else if (a === "notv") { S.noTV = true; next(); }
  else if (a === "up" || a === "down") { const i = +v, j = a === "up" ? i - 1 : i + 1; [S.langs[i], S.langs[j]] = [S.langs[j], S.langs[i]]; render(); }
  else if (a === "drop") { S.langs.splice(+v, 1); render(); }
  else if (a === "tour") { S.whenAsk = false; S.tour = v; S.ver = 0; S.verOpen = false; S.requested = false; S.rated = 0; S.remote = false; S.toast = null; render(); }
  else if (a === "veropen") { S.verOpen = true; render(); }
  else if (a === "pickver") { if (+v === 2) { S.requested = true; S.ver = 0; S.notif = null; } else { S.ver = +v; S.requested = false; } S.flash = "ver"; render(); }
  else if (a === "rate") { S.rated = +v; render(); setTimeout(() => { if (S.tour === "seen") { S.tasks.seen = true; S.tour = null; S.toast = `✓ Calificaste Matrix con ${v} ★. Con eso te conocemos mejor.`; render(); } }, 600); }
  else if (a === "remote") { S.remote = true; render(); }
  else if (a === "tourpick") { saveTitle(v); S.tasks.decide = true; S.tour = null; S.toast = `✓ ${POSTERS[v][0]} quedó en Mi lista`; render(); }
  else if (a === "taskdone") { S.tasks[v] = true; S.tour = null; S.sheet = null; S.toast = { lists: "✓ Interestelar quedó en Mi lista", tvsend: `✓ Pausaste la TV desde tu ${here()}`, follow: "✓ Sigues Shōgun donde te quedaste", where: "✓ Te llevamos directo a la plataforma", whennotify: "✓ Te avisamos cuando llegue a las tuyas" }[v] || null; if (v === "whennotify") S.tasks.where = true; if (v === "lists") saveTitle("interstellar"); render(); }
  else if (a === "playnow") { S.watched = true; go("playing"); }
  else if (a === "pincheck") { if (fails && !S.failed.pin) { S.failed.pin = 1; S.pin = false; return render(); } S.tv = true; S.fromTV = S.step !== "home"; S.trakt = true; S.cloud = S.cloud || (fails ? null : "Real-Debrid"); S.tvNoCloud = !S.cloud; S.sheet = null; render(); }
  else if (a === "nudge") { S.fromHome = true; if (v === "trakt") { S.traktSub = null; go("trakt"); } else if (v === "cloud") go("cloud"); else { S.fromHome = false; S.sheet = "tvcode"; S.tvSearch = null; render(); setTimeout(findTV, 1500); } }
  else if (a === "platsdone") { S.sheet = null; S.whenAsk = true; render(); }
  else if (a === "whenask") { S.whenAsk = true; render(); }
  else if (a === "fromphone") { if (fails && !S.failed.phone) { S.failed.phone = 1; return render(); } S.fromPhone = true; S.trakt = true; if (watches()) S.cloud = "Real-Debrid"; else S.platforms = ["Netflix"]; if (edition === "ultra") S.tv = true; render(); }
  else if (a === "keycheck") { if (fails && !S.failed.key) { S.failed.key = 1; S.keyPasted = false; return render(); } S.cloud = S.keyFor; S.sheet = null; render(); }
  else if (a === "tvsearch") { if (v === "go") { S.tvSearch = null; render(); setTimeout(findTV, 1500); } else { S.tvSearch = v; render(); } }
  else if (a === "tohome") go("home");
  else if (a === "notif") { S.notif = v === "yes"; render(); }
  else if (a === "typepin") { S.pin = true; render(); }
  else if (a === "rdwait") { S.rdWait = true; render(); setTimeout(() => { if (S.rdWait) { S.rdWait = false; if (fails && !S.failed.rd) { S.failed.rd = 1; return render(); } S.cloud = "Real-Debrid"; S.sheet = null; render(); } }, 4000); }
  else if (a === "rdcheck") { S.rdWait = false; if (fails && !S.failed.rd) { S.failed.rd = 1; return render(); } S.cloud = "Real-Debrid"; S.sheet = null; render(); }
  else if (a === "notseen") { S.tasks.seen = true; S.tour = null; S.toast = "Sin problema: no la marcamos."; render(); }
  else if (a === "dismiss") { S.dismissed.push(v); render(); }
});
function seg(id, cb) {
  document.getElementById(id).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    [...e.currentTarget.children].forEach(x => x.setAttribute("aria-pressed", x === b)); cb(b.dataset.v);
  });
}
seg("ed", v => { edition = v; reset(); render(); });
seg("dev", v => { device = v; document.getElementById("device").classList.toggle("ipad", v === "ipad"); render(); });
document.addEventListener("change", e => {
  if (e.target.id === "addlang" && e.target.value) { S.langs.push(e.target.value); render(); }
  if (e.target.id === "dubpick") { S.dub = e.target.value; setListen("dub"); render(); }
});
document.getElementById("restart").addEventListener("click", () => { reset(); render(); });
document.getElementById("fails").addEventListener("click", e => { fails = !fails; e.currentTarget.setAttribute("aria-pressed", fails); e.currentTarget.textContent = "Simular fallas: " + (fails ? "sí" : "no"); reset(); render(); });
render();
</script>
