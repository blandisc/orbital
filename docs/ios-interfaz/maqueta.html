<!doctype html>
<html lang="es"><meta charset="utf-8">
<title>Orbital para iPhone: maqueta</title>
<style>
:root{
  --ink-1000:#070708;--ink-950:#0c0c0e;--ink-900:#131316;--ink-850:#18181c;--ink-800:#1e1e23;--ink-700:#2a2a30;--ink-500:#55555d;--ink-300:#a3a3ab;--ink-200:#cdcdd3;--paper:#f5f4f0;
  --red:#f0574d;--amber:#f4c24d;--teal:#5fd6c6;--green:#5cbf6d;--blue:#4a8ae8;
  --hair:rgba(255,255,255,.09);--fill:rgba(255,255,255,.1);--muted:var(--ink-300);--faint:rgba(255,255,255,.5);
}
*{box-sizing:border-box;margin:0}
body{background:#2b2b31;font-family:-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;color:var(--paper);padding:28px;display:flex;flex-wrap:wrap;gap:34px;align-items:flex-start;width:2150px}
figure{display:flex;flex-direction:column;gap:10px}
figcaption{font-size:15px;color:var(--ink-200);width:390px;line-height:1.35}
figcaption b{color:var(--paper);display:block;font-size:17px;margin-bottom:2px}
.phone{width:390px;height:844px;border-radius:46px;background:var(--ink-950);position:relative;overflow:hidden;border:7px solid #0a0a0b;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.phone.land{width:844px;height:390px}
.tint{position:absolute;inset:0;background:linear-gradient(180deg,var(--tint,#2a3550) 0%,var(--ink-950) 62%)}
.status{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 6px;font-size:15px;font-weight:600;z-index:5}
.scroll{position:absolute;top:50px;left:0;right:0;bottom:84px;overflow:hidden;padding:6px 18px}
.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;background:color-mix(in oklab,var(--ink-1000) 82%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--hair);display:flex;justify-content:space-around;padding-top:9px;z-index:6}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--faint);width:64px}
.tab i{font-style:normal;font-size:21px;line-height:24px}
.tab.on{color:var(--paper)}
.top{display:flex;justify-content:space-between;align-items:center;margin:2px 0 14px}
.brand{font-size:23px;font-weight:700;letter-spacing:-.01em}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;background:var(--fill);padding:5px 11px;font-size:12.5px;color:var(--ink-200)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--teal)}.dot.off{background:var(--ink-500)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--ink-700);display:grid;place-items:center;font-size:14px}
h2{font-size:19px;font-weight:650;margin:20px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-size:13px;font-weight:400;color:var(--muted)}
.poster{border-radius:11px;background:linear-gradient(160deg,var(--c1,#3a4a6b),var(--c2,#14141a));position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:9px;font-size:13px;font-weight:650;line-height:1.15;box-shadow:0 8px 22px rgba(0,0,0,.35)}
.row{display:flex;gap:11px}
.row .poster{width:112px;height:168px;flex:none}
.bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.2)}.bar b{display:block;height:100%;background:var(--paper)}
.hero{height:310px;border-radius:20px;--c1:#6b4a3a;--c2:#17120f;position:relative;padding:0;align-items:stretch}
.hero .in{margin-top:auto;padding:16px;width:100%;background:linear-gradient(0deg,rgba(7,7,8,.92),transparent)}
.hero h1{font-size:27px;font-weight:700;letter-spacing:-.01em}
.meta{font-size:13.5px;color:var(--ink-200);margin:3px 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:13px;padding:12px 18px;font-weight:650;font-size:16px;background:var(--paper);color:var(--ink-1000)}
.btn.sec{background:var(--fill);color:var(--paper)}
.btns{display:flex;gap:9px}.btns .btn{flex:1}.btns .btn.sq{flex:none;width:48px;padding:12px 0}
.chip{display:inline-block;border-radius:7px;background:rgba(255,255,255,.1);padding:3px 8px;font-size:12px;color:var(--ink-200);white-space:nowrap}
.chip.good{color:var(--teal)}.chip.warn{color:var(--amber)}
.badge{position:absolute;top:8px;left:8px;background:rgba(7,7,8,.8);border-radius:7px;padding:3px 8px;font-size:11.5px;font-weight:600;color:var(--paper)}
.seg{display:flex;gap:8px;overflow:hidden;margin:6px 0 12px}
.seg span{padding:7px 14px;border-radius:99px;background:var(--fill);font-size:14px;white-space:nowrap}.seg .on{background:var(--paper);color:var(--ink-1000);font-weight:650}
.ep{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--hair);align-items:center}
.ep .poster{width:122px;height:70px;flex:none;border-radius:8px;padding:0}
.ep .t{flex:1;min-width:0}.ep .t b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ep .t span{font-size:12.5px;color:var(--muted)}
.ic{width:34px;height:34px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:15px;flex:none}
.ic.done{background:var(--teal);color:var(--ink-1000)}
.sheet{position:absolute;left:0;right:0;bottom:0;height:610px;border-radius:26px 26px 0 0;background:linear-gradient(180deg,var(--ink-850),var(--ink-900) 40%);padding:10px 18px;z-index:8;box-shadow:0 -20px 50px rgba(0,0,0,.6)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--ink-500);margin:0 auto 14px}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:7}
.src{display:flex;gap:11px;padding:11px 12px;border-radius:14px;background:var(--fill);margin-bottom:9px;align-items:center}
.src.best{background:rgba(255,255,255,.17);outline:1.5px solid var(--paper)}
.src .t{flex:1;min-width:0}.src .t b{font-size:15px;font-weight:600;display:block;margin-bottom:5px}.src .chips{display:flex;gap:5px;flex-wrap:wrap}
.dl{padding:12px 0;border-bottom:1px solid var(--hair);display:flex;gap:12px;align-items:center}
.dl .poster{width:62px;height:92px;flex:none;border-radius:8px}
.prog{height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:7px 0 4px;overflow:hidden}.prog b{display:block;height:100%;background:var(--paper)}
.card{border-radius:16px;background:var(--ink-850);border:1px solid var(--hair);padding:13px 14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid .poster{height:150px}
.land .vid{position:absolute;inset:0;background:linear-gradient(120deg,#1c2433,#0a0a0c 60%,#2a1c14)}
.ctl{position:absolute;left:0;right:0;padding:0 34px;z-index:3}
.scrub{height:5px;border-radius:3px;background:rgba(255,255,255,.25);position:relative;margin:8px 0}.scrub b{position:absolute;left:0;top:0;bottom:0;width:38%;background:var(--paper);border-radius:3px}.scrub i{position:absolute;left:38%;top:-6px;width:17px;height:17px;border-radius:50%;background:var(--paper);margin-left:-8px}
.round{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;font-size:19px}
.panel{position:absolute;top:0;right:0;bottom:0;width:290px;background:linear-gradient(180deg,var(--ink-850),var(--ink-900));padding:12px 14px;z-index:5;border-radius:20px 0 0 20px}
.panel h3{font-size:12.5px;color:var(--muted);font-weight:500;margin:7px 0 3px}
.opt{padding:5px 9px;border-radius:8px;font-size:13px;display:flex;justify-content:space-between}.opt.on{background:var(--paper);color:var(--ink-1000);font-weight:600}
.banner{border-radius:12px;background:rgba(244,194,77,.12);color:var(--amber);padding:9px 12px;font-size:13px;margin-bottom:10px}
.mosaic{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mosaic .poster{height:210px}.mosaic .poster:nth-child(2n){margin-top:30px}
.sys{display:flex;gap:8px;overflow:hidden;margin-bottom:12px}.sys span{padding:7px 13px;border-radius:99px;background:var(--fill);font-size:14px;white-space:nowrap}.sys .on{background:var(--paper);color:var(--ink-1000);font-weight:650}
.mos{display:flex;gap:8px;align-items:flex-start;justify-content:center}
.col{display:flex;flex-direction:column;gap:8px}.col .poster{border-radius:12px;width:100%;padding:0}
.poster.foc{outline:2px solid var(--paper);outline-offset:2px;position:relative;box-shadow:0 14px 30px rgba(0,0,0,.55)}
.poster.foc .inf{margin-top:auto;padding:10px;width:100%;background:linear-gradient(0deg,rgba(7,7,8,.92),transparent);display:flex;flex-direction:column;gap:2px}
.poster.foc .inf b{font-size:23px;font-weight:750;letter-spacing:-.01em}.poster.foc .inf span{font-size:12px;font-weight:500;color:var(--ink-200)}
.corner{position:absolute;top:9px;right:9px;width:24px;height:24px;border-radius:7px;background:rgba(7,7,8,.8);display:grid;place-items:center;font-size:12px}
.plat{display:flex;align-items:center;gap:9px;margin:12px 0 7px}.plat b{font-size:16px}.plat small{color:var(--muted);font-size:12.5px;margin-left:auto}
.lg{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:800}
.row.sm .poster{width:112px;height:150px;flex:none;font-size:12px}
</style>
