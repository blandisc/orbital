[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbital"
version = "0.1.0"
description = "Interfaz tipo consola para Lenovo Legion Go: Steam, emuladores, Stremio y control por voz con Alexa"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
window = ["pywebview>=5.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
orbital = "orbital.__main__:main"

[tool.setuptools.packages.find]
include = ["orbital*"]

[tool.setuptools.package-data]
orbital = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
