[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbital"
version = "0.1.0"
description = "Interfaz tipo consola para Lenovo Legion Go: Steam, emuladores, Stremio y control por voz con Alexa"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
    # Portadas del tamaño de la tarjeta (thumbs.py): las del scraper pesan hasta 2,5 MB
    "pillow>=10",
    # Música: los controles de medios de Windows (Apple Music, Spotify…)
    "winrt-runtime>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Control>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
window = ["pywebview>=5.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
orbital = "orbital.__main__:main"

[tool.setuptools.packages.find]
include = ["orbital*"]

[tool.setuptools.package-data]
orbital = ["web/*.html", "web/js/**/*.js", "web/styles/**/*.css", "web/styles/*.json", "web/icons/*", "web/img/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["alexa"]

[tool.ruff.lint]
# Errores reales y orden de imports; el estilo fino no bloquea.
select = ["E9", "F", "I", "B", "UP", "PIE"]
ignore = [
    "B008",  # FastAPI usa llamadas en los valores por defecto
    "B904",  # raise HTTPException dentro de except: el mensaje es para la persona, no la causa
    "UP031", # "%" en un par de plantillas de texto fijas
]

[tool.ruff.lint.isort]
known-first-party = ["orbital"]

[tool.pyright]
include = ["orbital"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportAttributeAccessIssue = "warning"
reportOptionalMemberAccess = "warning"
