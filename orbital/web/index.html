<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbital</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">● Orbital</div>
    <div id="now-playing" class="now-playing hidden"></div>
    <div id="clock" class="clock"></div>
  </header>

  <main id="rows" class="rows" aria-live="polite">
    <p class="empty">Cargando biblioteca…</p>
  </main>

  <footer class="footer">
    <span><kbd data-glyph="select">A</kbd> Abrir</span>
    <span><kbd data-glyph="back">B</kbd> Atrás</span>
    <span><kbd data-glyph="refresh">Y</kbd> Actualizar</span>
    <span id="status-msg" class="status-msg"></span>
  </footer>

  <div id="toast" class="toast hidden" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
