<!doctype html>
<html lang="es" data-theme="orbital">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Orbital</title>
  <link rel="icon" type="image/png" sizes="256" href="icons/orbital-256.png">
  <link rel="apple-touch-icon" href="icons/orbital-512.png">
  <link rel="stylesheet" href="styles/main.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- La entrada (boot.css, app/boot.js): la marca del iPhone (OrbitalWordmark) al centro; al estar lista la biblioteca,
       viaja a su lugar en la barra. -->
  <div id="boot" role="status" aria-label="Orbital se está abriendo">
    <div class="boot__brand" aria-hidden="true">
      <svg class="boot__mark" viewBox="0 0 32 32"><circle class="boot__planet" cx="16" cy="16" r="7.2" fill="none" stroke="currentColor" stroke-width="2.8"/><path class="boot__ring" pathLength="1" d="M3.2 20.4c3.8 3.1 21.2-2.4 26-8.8" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>
      <span class="boot__word"><span style="--i: 0">o</span><span style="--i: 1">r</span><span style="--i: 2">b</span><span style="--i: 3">i</span><span style="--i: 4">t</span><span style="--i: 5">a</span><span style="--i: 6">l</span><i class="boot__moon"></i></span>
    </div>
    <div class="boot__status"></div>
  </div>
  <!-- main.js reemplaza este nodo por los componentes de la interfaz. -->
  <div id="app"></div>
  <noscript>Orbital necesita JavaScript.</noscript>
</body>
</html>
