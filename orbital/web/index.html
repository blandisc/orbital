<!doctype html>
<html lang="es" data-theme="orbital">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Orbital</title>
  <link rel="icon" type="image/png" sizes="256" href="icons/orbital-256.png">
  <link rel="apple-touch-icon" href="icons/orbital-512.png">
  <!-- La pantalla de arranque va en línea: se pinta en el primer cuadro, antes que todo lo demás. -->
  <style>
    #boot {
      position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; overflow: hidden;
      background: radial-gradient(ellipse at 50% 42%, #17171c 0%, #0c0c0e 55%, #070708 100%);
      color: #f5f4f0; font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    }
    #boot .boot__stars {
      position: absolute; inset: -20%; opacity: .55;
      background-image:
        radial-gradient(1.5px 1.5px at 12% 22%, #fff, transparent), radial-gradient(1px 1px at 72% 18%, #fff, transparent),
        radial-gradient(1px 1px at 33% 78%, #fff, transparent), radial-gradient(1.5px 1.5px at 86% 64%, #fff, transparent),
        radial-gradient(1px 1px at 52% 46%, #fff, transparent), radial-gradient(1px 1px at 8% 58%, #fff, transparent);
      background-size: 38vmin 38vmin;
      animation: boot-drift 14s linear infinite;
    }
    #boot .boot__system { position: relative; width: 34vmin; height: 34vmin; display: grid; place-items: center; }
    #boot .boot__planet {
      width: 13vmin; height: 13vmin; border-radius: 50%;
      background: radial-gradient(circle at 34% 30%, #ffffff 0%, #d9d9df 32%, #8e8e98 70%, #3b3b42 100%);
      box-shadow: 0 0 6vmin -1vmin rgba(240, 240, 255, .35);
      animation: boot-rise 900ms cubic-bezier(.16, 1, .3, 1) both;
    }
    #boot .boot__orbit {
      position: absolute; left: 50%; top: 50%; width: 30vmin; height: 10.5vmin; margin: -5.25vmin 0 0 -15vmin;
      border-radius: 50%; border: .3vmin solid rgba(245, 244, 240, .85); transform: rotate(-24deg);
      animation: boot-orbit-in 1100ms cubic-bezier(.16, 1, .3, 1) 150ms both;
    }
    #boot .boot__orbit--front { clip-path: inset(50% 0 0 0); z-index: 2; }
    #boot .boot__satellite {
      position: absolute; left: 0; top: 0; width: 1.6vmin; height: 1.6vmin; border-radius: 50%; background: #fff;
      box-shadow: 0 0 2vmin .4vmin rgba(240, 87, 77, .9);
      offset-path: ellipse(50% 50% at 50% 50%); offset-rotate: 0deg;
      animation: boot-satellite 2.4s linear infinite;
    }
    #boot .boot__word {
      position: absolute; bottom: 26vh; font-size: 4.2vmin; font-weight: 700; letter-spacing: .32em; text-indent: .32em;
      text-transform: lowercase; animation: boot-word 1200ms cubic-bezier(.16, 1, .3, 1) 380ms both;
    }
    #boot .boot__status {
      position: absolute; bottom: 20vh; color: #a3a3ab; font-size: 1.9vmin; letter-spacing: .04em;
      opacity: 0; transition: opacity 400ms ease;
    }
    #boot .boot__status:not(:empty) { opacity: 1; }
    /* Salida: la cámara se zambulle en el planeta y la interfaz aparece detrás. */
    #boot.boot--leaving { animation: boot-fade 800ms cubic-bezier(.5, 0, .75, 0) 220ms forwards; }
    #boot.boot--leaving .boot__system { animation: boot-dive 900ms cubic-bezier(.7, 0, .84, 0) forwards; }
    #boot.boot--leaving .boot__word, #boot.boot--leaving .boot__status { animation: boot-out 300ms ease forwards; }
    @keyframes boot-drift { to { transform: translate(-38vmin, -19vmin); } }
    @keyframes boot-rise { from { opacity: 0; transform: scale(.6); } }
    @keyframes boot-orbit-in { from { opacity: 0; transform: rotate(-24deg) scale(.4); } }
    @keyframes boot-satellite { from { offset-distance: 0%; } to { offset-distance: 100%; } }
    @keyframes boot-word { from { opacity: 0; letter-spacing: .8em; } }
    @keyframes boot-out { to { opacity: 0; transform: translateY(1vh); } }
    @keyframes boot-dive { to { transform: scale(9); opacity: 0; } }
    @keyframes boot-fade { to { opacity: 0; visibility: hidden; } }
    @media (prefers-reduced-motion: reduce) {
      #boot *, #boot { animation-duration: 1ms !important; animation-delay: 0s !important; }
    }
  </style>
  <link rel="stylesheet" href="styles/main.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="boot" role="status" aria-label="Orbital se está abriendo">
    <div class="boot__stars"></div>
    <div class="boot__system" aria-hidden="true">
      <div class="boot__orbit"><span class="boot__satellite"></span></div>
      <div class="boot__planet"></div>
      <div class="boot__orbit boot__orbit--front"></div>
    </div>
    <div class="boot__word">orbital</div>
    <div class="boot__status"></div>
  </div>
  <!-- main.js reemplaza este nodo por los componentes de la interfaz. -->
  <div id="app"></div>
  <noscript>Orbital necesita JavaScript.</noscript>
</body>
</html>
