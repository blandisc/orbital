<!doctype html>
<html lang="es" data-theme="orbital">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Orbital</title>
  <link rel="icon" type="image/png" sizes="256" href="icons/orbital-256.png">
  <link rel="apple-touch-icon" href="icons/orbital-512.png">
  <link rel="stylesheet" href="styles/main.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="boot" role="status" aria-label="Orbital se está abriendo">
    <div class="boot__stars"></div>
    <div class="boot__system" aria-hidden="true">
      <div class="boot__orbit"><span class="boot__satellite"></span></div>
      <div class="boot__planet"></div>
      <div class="boot__orbit boot__orbit--front"></div>
    </div>
    <div class="boot__word">orbital</div>
    <div class="boot__status"></div>
  </div>
  <!-- main.js reemplaza este nodo por los componentes de la interfaz. -->
  <div id="app"></div>
  <noscript>Orbital necesita JavaScript.</noscript>
</body>
</html>
