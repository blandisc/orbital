# Proyecto de Xcode de Orbital para iPhone, iPad y Mac (XcodeGen: https://github.com/yonaskolb/XcodeGen).
#
#   brew install xcodegen
#   cd ios/App && xcodegen        # crea Orbital.xcodeproj (no se sube al repo)
#   open Orbital.xcodeproj        # pon tu equipo en Signing & Capabilities y ejecuta en tu iPhone
#
# Cambia en UN solo lugar: el identificador de la app (PRODUCT_BUNDLE_IDENTIFIER) y el equipo (DEVELOPMENT_TEAM).
name: Orbital
options:
  bundleIdPrefix: mx.iracheta   # solo un respaldo: cada target fija su PRODUCT_BUNDLE_IDENTIFIER
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: es

packages:
  OrbitalCore:
    path: ../OrbitalCore
  # Motor de video principal. Fija la versión exacta (es un proyecto joven que publica a menudo).
  # Si no compila con tu Xcode, quita este paquete y la bandera AETHER_ENGINE de abajo: la app usa AVPlayer.
  AetherEngine:
    url: https://github.com/superuser404notfound/AetherEngine
    exactVersion: 7.35.1

targets:
  Orbital:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      - path: Shared
    dependencies:
      - target: OrbitalWidgets               # la actividad en vivo de las descargas
      - package: OrbitalCore
        product: OrbitalCore
      - package: OrbitalCore
        product: OrbitalModels
      - package: OrbitalCore
        product: OrbitalAddons
      - package: AetherEngine
        product: AetherEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.iracheta.orbital
        DEVELOPMENT_TEAM: B7KRCF776Z
        TARGETED_DEVICE_FAMILY: "1,2"         # iPhone y iPad (y la Mac con chip de Apple, «Diseñada para iPad»)
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SWIFT_VERSION: "6.0"                  # la app en modo Swift 6, como los paquetes (29 oct 2026)
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) AETHER_ENGINE"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconNight   # Ajustes › Apariencia › Ícono: Cielo nocturno
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        # El Client ID de la app de Trakt incluida (las nuevas, con PKCE, no tienen secreto): con él el iPhone conecta su propia
        # sesión con un código, sin consola. Vacío: se usa el de tu Orbital o el de Ajustes › Trakt › Avanzado.
        ORBITAL_TRAKT_CLIENT_ID: "azwc8vQEPFj8BHrEgryPl_8WKoLtfxGyhtq-alnd9U0"   # la app de Trakt de Orbital (público, no es secreto)
        # Qué versión se compila (D1-B): ultra (la de Fernando, todo), plus (Real-Debrid sin consola) u orbital (App Store, sin
        # Real-Debrid). La lee `ThisDevice.capabilities` una vez; vacía o desconocida, ultra. Los destinos aparte vienen después.
        ORBITAL_EDITION: ultra
      # Release sin símbolos de depuración dentro del binario (A14, 10 nov 2026): pesa menos al instalar. Los dSYM se siguen
      # generando aparte para leer fallos.
      configs:
        Release:
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: non-global
    # La clave de TMDB incluida (`ORBITAL_TMDB_KEY`) vive en `Secrets.xcconfig`, que no va a git (el repo es público):
    # copia `Secrets.example.xcconfig`. Sin ella la app compila igual y pide la clave en Ajustes › Avanzado.
    configFiles:
      Debug: Orbital.xcconfig
      Release: Orbital.xcconfig
    entitlements:
      path: Build/Orbital.entitlements
      properties:
        com.apple.security.application-groups: [group.mx.iracheta.orbital]   # el snapshot del widget «Lo siguiente para ti»
    info:
      path: Build/Info.plist
      properties:
        CFBundleDisplayName: Orbital
        # Cada instalación con su número (`CURRENT_PROJECT_VERSION=$(git rev-list --count HEAD)` al compilar): con «1» fijo iOS
        # no refrescaba los íconos del Centro de control en su galería y no se podía saber qué versión tenía el iPhone.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en]
        OrbitalTraktClientID: $(ORBITAL_TRAKT_CLIENT_ID)   # lo lee Services.bundledTraktClientID
        OrbitalEdition: $(ORBITAL_EDITION)   # lo lee Edition.bundled() (D1-B)
        OrbitalTMDBKey: $(ORBITAL_TMDB_KEY)   # lo lee Services.bundledTMDBKey (de Secrets.xcconfig)
        OrbitalOpenSubtitlesKey: $(ORBITAL_OPENSUBTITLES_KEY)   # lo lee Services.bundledOpenSubtitlesKey (de Secrets.xcconfig)
        UILaunchScreen: {}
        UIAppFonts: [Sora-SemiBold.ttf]   # la letra de «orbital» (DS.Brand.wordFont), la misma de la TV
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # El iPad gira libre y comparte pantalla (Split View, Stage Manager): las cuatro, y la app se acomoda a su ventana.
        "UISupportedInterfaceOrientations~ipad": [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio, fetch, processing]   # audio: sigue sonando con la pantalla apagada y en PiP · fetch y processing: mirar lo que dejó la TV (mejor esfuerzo)
        BGTaskSchedulerPermittedIdentifiers: [mx.iracheta.orbital.inbox, mx.iracheta.orbital.releases, mx.iracheta.orbital.downloads.keep]   # downloads.keep: la tarea continua que mantiene rápidas las descargas con la app cerrada
        ITSAppUsesNonExemptEncryption: false
        CADisableMinimumFrameDurationOnPhone: true   # 120 Hz en las pantallas ProMotion (la inercia del mosaico, el carrusel)
        NSSupportsLiveActivities: true          # descargas en la pantalla bloqueada y la Dynamic Island
        # El micrófono del control: le das órdenes a tu Orbital con la voz (como Alexa).
        NSCameraUsageDescription: "Para leer el código de tu Orbital en la TV y conectarla."
        NSMicrophoneUsageDescription: "Para darle órdenes de voz a tu Orbital, como a Alexa."
        NSSpeechRecognitionUsageDescription: "Para entender lo que le pides a tu Orbital."
        # Para volver desde Infuse: orbital-ios://infuse-done?lastPlayedUrl=…&position=…
        CFBundleURLTypes:
          - CFBundleURLName: com.example.orbital.ios.infuse-callback
            CFBundleURLSchemes: [orbital-ios]
        # Abrir videos que te pasen (AirDrop, Archivos, «Abrir con…»): se copian a la app y se reproducen; si se reconoce cuál es
        # (por el nombre del archivo), con sus subtítulos de OpenSubtitles.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie, public.mpeg-4, com.apple.quicktime-movie, public.avi, org.matroska.mkv]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.matroska.mkv
            UTTypeDescription: Video Matroska
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [mkv]
              public.mime-type: [video/x-matroska]
        LSSupportsOpeningDocumentsInPlace: false
        # Para poder preguntar si Infuse está instalado.
        LSApplicationQueriesSchemes: [infuse]
        # Los complementos de Stremio pueden dar enlaces http (no solo https) para el video.
        # App personal: los complementos (y a veces sus archivos) pueden usar http, no solo https.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    scheme:
      testTargets: [OrbitalUITests]

  # Extensión de widgets: «Lo siguiente para ti» (Seguir viendo) y la actividad en vivo de las descargas.
  OrbitalWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: Resources/Localizable.xcstrings
      # Su propio catálogo (`Widgets/Symbols.xcassets`, dentro de `Widgets`): solo los dos símbolos que usa (la marca de Orbital
      # y la dona). Antes empacaba todo el arte de la app (~4 MB) (A14). Los copian scripts/orbital_symbol.py y donut_symbol.py.
      - path: Sources/Design/Tokens.swift     # los mismos tokens que la app (`DS`)
      - path: Sources/Design/Tokens+Player.swift
      - path: Sources/Design/Tokens+Screens.swift   # `Brand.swift` usa DS.Splash
      - path: Sources/Design/Tokens+Simpsons.swift   # el widget de la dona usa DS.Simpsons
      - path: Sources/Design/Tokens+Home.swift      # «Lo nuevo de lo tuyo» usa los de la línea de Inicio (DS.HomeTimeline)
      - path: Sources/Design/Brand.swift      # la marca de Orbital (widget sin pendientes)
      - path: Sources/Design/CornerRibbon.swift   # el listón «Nuevo» de «Lo nuevo de lo tuyo»
      - path: Sources/Platform/WindowMetrics.swift   # el tamaño de ventana que leen los tokens
    dependencies:
      - package: OrbitalCore
        product: OrbitalCore
    entitlements:
      path: Build/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.mx.iracheta.orbital]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.iracheta.orbital.widgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"   # `WindowMetrics`: sin ventana ni UIApplication
        DEVELOPMENT_TEAM: B7KRCF776Z
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Release:   # como la app (A14)
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: non-global
    info:
      path: Build/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Orbital
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)   # el mismo número que la app (iOS lo exige)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDevelopmentRegion: es
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Pruebas de interfaz (XCUITest): gestos de verdad en el simulador (arrastrar el mosaico, tocar), con el modo demo.
  #   xcodebuild test -project Orbital.xcodeproj -scheme Orbital -destination 'platform=iOS Simulator,name=Orbital QA'
  OrbitalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Orbital
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.iracheta.orbital.uitests
        DEVELOPMENT_TEAM: B7KRCF776Z
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: Orbital
        GENERATE_INFOPLIST_FILE: YES

  # Recorrido de la Mac («Diseñada para iPad»): Xcode no corre XCUITest ahí, así que esta prueba vive dentro de la app
  # (en modo demostración) y la recorre por dentro con capturas de la ventana. Esquema `OrbitalMac` (abajo).
  OrbitalMacTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MacTests
    dependencies:
      - target: Orbital
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.iracheta.orbital.mactests
        DEVELOPMENT_TEAM: B7KRCF776Z
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Orbital.app/Orbital"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  OrbitalMac:
    build:
      targets:
        Orbital: all
        OrbitalMacTests: [test]
    test:
      config: Debug
      targets: [OrbitalMacTests]
      commandLineArguments:
        "-demo": true
        "-demo-free-tabs": true
        "-demo-no-idle": true
