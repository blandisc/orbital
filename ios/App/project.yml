# Proyecto de Xcode de Orbital para iPhone (XcodeGen: https://github.com/yonaskolb/XcodeGen).
#
#   brew install xcodegen
#   cd ios/App && xcodegen        # crea Orbital.xcodeproj (no se sube al repo)
#   open Orbital.xcodeproj        # pon tu equipo en Signing & Capabilities y ejecuta en tu iPhone
#
# Cambia en UN solo lugar: el identificador de la app (PRODUCT_BUNDLE_IDENTIFIER) y el equipo (DEVELOPMENT_TEAM).
name: Orbital
options:
  bundleIdPrefix: com.example.orbital
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: es

packages:
  OrbitalCore:
    path: ../OrbitalCore
  # Motor de video principal. Fija la versión exacta (es un proyecto joven que publica a menudo).
  # Si no compila con tu Xcode, quita este paquete y la bandera AETHER_ENGINE de abajo: la app usa AVPlayer.
  AetherEngine:
    url: https://github.com/superuser404notfound/AetherEngine
    exactVersion: 7.35.1

targets:
  Orbital:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      - path: Shared
    dependencies:
      - target: OrbitalWidgets               # la actividad en vivo de las descargas
      - package: OrbitalCore
        product: OrbitalCore
      - package: OrbitalCore
        product: OrbitalModels
      - package: AetherEngine
        product: AetherEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.iracheta.orbital
        DEVELOPMENT_TEAM: B7KRCF776Z
        TARGETED_DEVICE_FAMILY: "1"           # solo iPhone
        SWIFT_VERSION: "5.0"                  # la app en modo Swift 5; los paquetes ya van en Swift 6
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) AETHER_ENGINE"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconNight   # Ajustes › Apariencia › Ícono: Cielo nocturno
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        # El Client ID de la app de Trakt incluida (las nuevas, con PKCE, no tienen secreto): con él el iPhone conecta su propia
        # sesión con un código, sin consola. Vacío: se usa el de tu Orbital o el de Ajustes › Trakt › Avanzado.
        ORBITAL_TRAKT_CLIENT_ID: ""
    entitlements:
      path: Build/Orbital.entitlements
      properties:
        com.apple.security.application-groups: [group.mx.iracheta.orbital]   # el snapshot del widget «Lo siguiente para ti»
    info:
      path: Build/Info.plist
      properties:
        CFBundleDisplayName: Orbital
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en]
        OrbitalTraktClientID: $(ORBITAL_TRAKT_CLIENT_ID)   # lo lee Services.bundledTraktClientID
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio, fetch, processing]   # audio: sigue sonando con la pantalla apagada y en PiP · fetch y processing: mirar lo que dejó la TV (mejor esfuerzo)
        BGTaskSchedulerPermittedIdentifiers: [mx.iracheta.orbital.inbox, mx.iracheta.orbital.releases, mx.iracheta.orbital.downloads.keep]   # downloads.keep: la tarea continua que mantiene rápidas las descargas con la app cerrada
        ITSAppUsesNonExemptEncryption: false
        CADisableMinimumFrameDurationOnPhone: true   # 120 Hz en las pantallas ProMotion (la inercia del mosaico, el carrusel)
        NSSupportsLiveActivities: true          # descargas en la pantalla bloqueada y la Dynamic Island
        # El micrófono del control: le das órdenes a tu Orbital con la voz (como Alexa).
        NSMicrophoneUsageDescription: "Para darle órdenes de voz a tu Orbital, como a Alexa."
        NSSpeechRecognitionUsageDescription: "Para entender lo que le pides a tu Orbital."
        # Para volver desde Infuse: orbital-ios://infuse-done?lastPlayedUrl=…&position=…
        CFBundleURLTypes:
          - CFBundleURLName: com.example.orbital.ios.infuse-callback
            CFBundleURLSchemes: [orbital-ios]
        # Abrir videos que te pasen (AirDrop, Archivos, «Abrir con…»): se copian a la app y se reproducen; si se reconoce cuál es
        # (por el nombre del archivo), con sus subtítulos de OpenSubtitles.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie, public.mpeg-4, com.apple.quicktime-movie, public.avi, org.matroska.mkv]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.matroska.mkv
            UTTypeDescription: Video Matroska
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [mkv]
              public.mime-type: [video/x-matroska]
        LSSupportsOpeningDocumentsInPlace: false
        # Para poder preguntar si Infuse está instalado.
        LSApplicationQueriesSchemes: [infuse]
        # Los complementos de Stremio pueden dar enlaces http (no solo https) para el video.
        # App personal: los complementos (y a veces sus archivos) pueden usar http, no solo https.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    scheme:
      testTargets: [OrbitalUITests]

  # Extensión de widgets: «Lo siguiente para ti» (Seguir viendo) y la actividad en vivo de las descargas.
  OrbitalWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: Resources/Localizable.xcstrings
      - path: Resources/Assets.xcassets        # el arte que comparte con la app
      - path: Sources/Design/Tokens.swift     # los mismos tokens que la app (`DS`)
      - path: Sources/Design/Brand.swift      # la marca de Orbital (widget sin pendientes)
    dependencies:
      - package: OrbitalCore
        product: OrbitalCore
    entitlements:
      path: Build/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.mx.iracheta.orbital]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.iracheta.orbital.widgets
        DEVELOPMENT_TEAM: B7KRCF776Z
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: Build/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Orbital
        CFBundleDevelopmentRegion: es
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Pruebas de interfaz (XCUITest): gestos de verdad en el simulador (arrastrar el mosaico, tocar), con el modo demo.
  #   xcodebuild test -project Orbital.xcodeproj -scheme Orbital -destination 'platform=iOS Simulator,name=Orbital QA'
  OrbitalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Orbital
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.iracheta.orbital.uitests
        DEVELOPMENT_TEAM: B7KRCF776Z
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: Orbital
        GENERATE_INFOPLIST_FILE: YES
