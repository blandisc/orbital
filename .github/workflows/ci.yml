name: Pruebas

on:
  push:
  pull_request:

# Por omisión la CI solo lee el repositorio; solo el último paso (tv-estable) pide permiso para escribir.
permissions:
  contents: read

# Versión de Xcode fija (la de Fernando es más nueva; la CI usa esta en todas las corridas). Si GitHub la quita de la
# imagen de macOS, el paso «Fijar Xcode» falla con un mensaje claro: se sube la versión aquí, en un solo lugar.
env:
  XCODE_VERSION: "26.3"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar (versiones del lockfile)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Revisión de código (ruff)
        run: python -m ruff check orbital tests scripts

      - name: Tipos (pyright)
        run: npx --yes pyright@1.1.390

      - name: Pruebas de Python
        run: python -m pytest -q --ignore=tests/smoke

      - name: Pruebas de la interfaz
        run: node --test tests/web/*.test.mjs

      - name: Pruebas de humo en un navegador (Playwright)
        run: |
          python -m pip install playwright==1.48.0
          python -m playwright install chromium
          python -m pytest -q tests/smoke

      - name: Ejemplos compartidos Python a Swift al día (tests/fixtures/ios)
        shell: bash
        run: |
          python scripts/ios_golden.py
          git diff --exit-code -- tests/fixtures/ios || {
            echo "::error::Los ejemplos de tests/fixtures/ios no coinciden con lo que genera Python. Corre 'python scripts/ios_golden.py' y sube el resultado."
            exit 1
          }

      - name: Empaquetado incluye la interfaz y los íconos
        shell: bash
        run: |
          python -m pip install build
          python -m build --wheel
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for needed in ("orbital/web/index.html", "orbital/web/js/main.js", "orbital/web/icons/orbital.ico", "orbital/remote_input_page.html"):
              assert needed in names, f"falta {needed} en el paquete"
          print("ok:", len(names), "archivos")
          EOF

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fijar Xcode
        run: |
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$app" ]; then
            echo "::error::Xcode ${XCODE_VERSION} no está en la imagen de macOS. Disponibles:"; ls -d /Applications/Xcode*
            exit 1
          fi
          sudo xcode-select -s "$app"
          xcodebuild -version

      - name: Pruebas del paquete y del sistema de diseño del iPhone
        working-directory: ios/OrbitalCore
        run: swift test

  # La app del iPhone/iPad/Mac misma: se genera el proyecto con XcodeGen y se compila para el simulador, sin firma,
  # en Debug y en Release (Release ya rompió una vez cosas que Debug no veía).
  #
  # PROVISIONAL (10 nov 2026): `continue-on-error` hasta que la app compile con el Xcode de la CI. Hoy el compilador de la
  # CI (Xcode 26.3, el más nuevo que ofrece GitHub) rechaza dos expresiones que el Xcode de la Mac acepta:
  #   - ios/App/Shared/WidgetImage.swift:26  («value of optional type 'Double?' must be unwrapped»)
  #   - ios/App/Sources/Design/Brand.swift:43 («unable to type-check this expression in reasonable time»)
  # Se arreglan partiendo la expresión en variables con tipo (ver el arreglo de Trakt+Ratings.swift). Cuando compile en
  # verde en Debug y Release, quitar `continue-on-error` para que cuente de verdad.
  iphone-app:
    runs-on: macos-15
    timeout-minutes: 40
    continue-on-error: true
    # Cuando llega un commit nuevo, la compilación del anterior se cancela: los runners de macOS son pocos y con varios
    # commits seguidos se forma fila.
    concurrency:
      group: iphone-app-${{ github.ref }}-${{ matrix.configuration }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Fijar Xcode
        run: |
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          [ -d "$app" ] || { echo "::error::Xcode ${XCODE_VERSION} no está en la imagen"; exit 1; }
          sudo xcode-select -s "$app"
          xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      # Secrets.xcconfig no está en git (el repo es público). Con las claves vacías la app compila igual y las pide en Ajustes.
      - name: Secrets.xcconfig de mentira (claves vacías)
        run: |
          printf 'ORBITAL_TMDB_KEY =\nORBITAL_OPENSUBTITLES_KEY =\n' > ios/App/Secrets.xcconfig

      - name: Generar el proyecto de Xcode
        working-directory: ios/App
        run: xcodegen

      # Los paquetes de Swift (AetherEngine) se bajan una vez y se guardan para las siguientes corridas.
      - uses: actions/cache@v4
        with:
          path: ~/spm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/App/project.yml', 'ios/OrbitalCore/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Compilar (${{ matrix.configuration }}, simulador, sin firma)
        working-directory: ios/App
        run: |
          xcodebuild build \
            -project Orbital.xcodeproj -scheme Orbital \
            -configuration "${{ matrix.configuration }}" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" -clonedSourcePackagesDirPath "$HOME/spm" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            > "$RUNNER_TEMP/build.log" 2>&1 && { tail -n 5 "$RUNNER_TEMP/build.log"; exit 0; }
          # Falló: se muestran solo los errores (el registro completo son miles de líneas).
          grep -E "error:|BUILD FAILED|FAILED" "$RUNNER_TEMP/build.log" | sort -u | head -n 40
          exit 1

  # Si todo lo demás pasó en `main`, la etiqueta `tv-estable` se mueve a este commit. La TV se actualiza desde esa
  # etiqueta, así que nunca recibe un commit que la CI no aprobó. Los commits que fallan no la tocan.
  tv-estable:
    needs: [windows, macos, iphone-app]
    # Mientras `iphone-app` sea provisional (ver arriba), no cuenta para la etiqueta; cuando deje de serlo, agregar
    # `&& needs.iphone-app.result == 'success'` aquí.
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.windows.result == 'success' && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: tv-estable
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mover la etiqueta tv-estable a este commit
        run: |
          # La etiqueta solo avanza: si ya apunta a un commit más nuevo (otra corrida terminó antes), no se toca.
          git fetch --tags --force origin
          if git rev-parse -q --verify refs/tags/tv-estable >/dev/null \
             && ! git merge-base --is-ancestor tv-estable "$GITHUB_SHA"; then
            echo "tv-estable ($(git rev-parse --short tv-estable)) ya está más adelante que $GITHUB_SHA; no se mueve."
            exit 0
          fi
          git tag -f tv-estable "$GITHUB_SHA"
          git push -f origin tv-estable
