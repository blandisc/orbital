# Configuración de Orbital para la Legion Go (Windows 11).
# Copia este archivo a %APPDATA%\orbital\config.yaml (el instalador lo hace por ti).
# Después de editarlo, comprueba con:  .venv\Scripts\python -m orbital --list
#
# En las rutas puedes usar variables como %USERPROFILE% o %LOCALAPPDATA%.

server:
  host: 127.0.0.1      # deja 127.0.0.1: Alexa entra por el túnel de Cloudflare
  port: 8710
  token: "CAMBIA-ESTE-TOKEN"   # el instalador pone uno aleatorio

ui:
  mode: browser        # browser = Edge en pantalla completa | window | none

steam:
  enabled: true        # la ruta se detecta sola

stremio:
  enabled: true        # se detecta solo (Stremio 4 o 5)
  audio: en            # Orbital elige la fuente con este idioma de audio (en, es…)
  quality: 1080p       # 1080p o 4K (en una TV 4K)
  subtitles: en        # idioma de subtítulos ("" = sin subtítulos)
  player: orbital      # orbital = reproductor propio con el mando (mpv); stremio = el de Stremio

# Que nada se quede abierto para siempre.
sessions:
  video_idle_minutes: 15   # un video en pausa tanto tiempo se cierra (el avance queda guardado); 0 = nunca
  game_idle_minutes: 60    # un juego congelado (saliste con Home) tanto tiempo se cierra; 0 = nunca
  close_previous: true     # abrir otra cosa cierra lo que estaba abierto (te pregunta si es un juego)

# ES-DE: Orbital lee de aquí tu carpeta de ROMs, los nombres de los juegos,
# las portadas que ya descargaste con el scraper y tus favoritos.
esde:
  enabled: true
  # Solo si no se detecta solo:
  # path: '%USERPROFILE%\ES-DE'            # instalador (carpeta con settings\ y gamelists\)
  # path: 'C:\ES-DE\ES-DE'                 # versión portable
  # executable: 'C:\ES-DE\ES-DE.exe'

# --- Emuladores --------------------------------------------------------------
# Orbital los DETECTA SOLO: busca Ryujinx, Eden, Citron, Dolphin, mGBA, xemu, Xenia,
# DuckStation, PCSX2, PPSSPP, melonDS y Cemu en Descargas, Escritorio, C:\Emuladores,
# la carpeta Emulators de ES-DE, Archivos de programa, etc. Revisa con:  orbital --list
detect:
  enabled: true
  # dirs: ['E:\Juegos\Emus']        # carpetas extra donde buscar

# Solo si quieres cambiar algo de lo detectado (o añadir uno que no conozca), escríbelo
# aquí con el mismo id: lo de este archivo manda. Ids detectables: switch, switch-eden,
# switch-citron, switch-sudachi, gamecube, wii, gba, xbox, xbox360, psx, ps2, psp, nds, wiiu.
# Placeholders en args: {rom}, {rom_dir}, {rom_name}. Las rutas aceptan comodines (* y **).
emulators: []
#  - id: gba                          # p. ej. usar RetroArch para GBA en vez de mGBA
#    name: Game Boy Advance
#    system: gba
#    executable: 'C:\RetroArch-Win64\retroarch.exe'
#    args: ["-L", 'C:\RetroArch-Win64\cores\mgba_libretro.dll', "-f", "{rom}"]
#    extensions: [.gba, .zip, .7z]
#
#  - id: switch                       # p. ej. ROMs de Switch fuera de la carpeta de ES-DE
#    name: Nintendo Switch
#    system: switch
#    executable: '%USERPROFILE%\Downloads\**\Ryujinx.exe'
#    args: ["--fullscreen", "{rom}"]
#    rom_dirs: ['D:\ROMs\switch']
#    extensions: [.nsp, .xci]

# Atajos extra: ejecutables o URLs/URIs. ES-DE ya aparece solo si se detecta.
apps:
  - id: youtube
    name: YouTube
    target: "https://www.youtube.com/tv"
    category: media
