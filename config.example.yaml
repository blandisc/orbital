# Configuración de Orbital para la Legion Go (Windows 11).
# Copia este archivo a %APPDATA%\orbital\config.yaml (el instalador lo hace por ti).
# Después de editarlo, comprueba con:  .venv\Scripts\python -m orbital --list
#
# En las rutas puedes usar variables como %USERPROFILE% o %LOCALAPPDATA%.

server:
  host: 127.0.0.1      # deja 127.0.0.1: Alexa entra por el túnel de Cloudflare
  port: 8710
  token: "CAMBIA-ESTE-TOKEN"   # el instalador pone uno aleatorio

ui:
  mode: browser        # browser = Edge en pantalla completa | window | none

steam:
  enabled: true        # la ruta se detecta sola

stremio:
  enabled: true        # se detecta solo (Stremio 4 o 5)

# ES-DE: Orbital lee de aquí tu carpeta de ROMs, los nombres de los juegos,
# las portadas que ya descargaste con el scraper y tus favoritos.
esde:
  enabled: true
  # Solo si no se detecta solo:
  # path: '%USERPROFILE%\ES-DE'            # instalador (carpeta con settings\ y gamelists\)
  # path: 'C:\ES-DE\ES-DE'                 # versión portable
  # executable: 'C:\ES-DE\ES-DE.exe'

# Cada emulador usa la carpeta de ES-DE de su "system" (p. ej. ROMs\switch).
# Si tus ROMs están en otro sitio, añade:  rom_dirs: ['D:\ROMs\switch']
# Placeholders en args: {rom}, {rom_dir}, {rom_name}
#
# Las rutas admiten comodines, así no importa el número de versión de la carpeta:
#   *  = cualquier nombre de carpeta      ** = cualquier subcarpeta, a cualquier profundidad
# Si hay varias versiones descargadas, se usa la más reciente.
# Revisa con "orbital --list" qué ejecutable encontró para cada uno.
emulators:
  # --- Nintendo Switch: Ryujinx (principal) + Eden (alternativo) ---
  # Los juegos salen una sola vez. Se abren con Ryujinx, salvo los que en ES-DE
  # tengan elegido Eden (Editar metadatos > Emulador alternativo), o si eliges
  # Eden para todo el sistema en ES-DE (Otros ajustes > Emuladores alternativos).
  - id: switch
    name: Nintendo Switch
    system: switch
    executable: '%USERPROFILE%\Downloads\**\Ryujinx.exe'
    args: ["--fullscreen", "{rom}"]
    extensions: [.nsp, .xci, .nca, .nro]
    exclude: ["[UPD]", "[DLC]", "(Update)", "(DLC)"]   # no mostrar actualizaciones ni DLC

  - id: switch-eden
    name: Eden
    system: switch
    executable: '%USERPROFILE%\Downloads\**\eden.exe'
    args: ["-f", "-g", "{rom}"]

  # --- GameCube y Wii: Dolphin ---
  - id: gamecube
    name: GameCube
    system: gc
    executable: '%USERPROFILE%\Downloads\**\Dolphin.exe'
    args: ["-b", "-e", "{rom}"]
    extensions: [.iso, .rvz, .gcz, .ciso, .gcm]

  - id: wii
    name: Wii
    system: wii
    executable: '%USERPROFILE%\Downloads\**\Dolphin.exe'
    args: ["-b", "-e", "{rom}"]
    extensions: [.iso, .rvz, .wbfs, .wia, .wad]

  # --- Game Boy Advance: mGBA ---
  - id: gba
    name: Game Boy Advance
    system: gba
    executable: '%USERPROFILE%\Downloads\**\mGBA.exe'
    args: ["-f", "{rom}"]
    extensions: [.gba, .zip, .7z]
  # Con RetroArch en vez de mGBA:
  #   executable: 'C:\RetroArch-Win64\retroarch.exe'
  #   args: ["-L", 'C:\RetroArch-Win64\cores\mgba_libretro.dll', "-f", "{rom}"]

  # --- Xbox original: xemu (las ISO deben estar en formato XISO) ---
  - id: xbox
    name: Xbox
    system: xbox
    executable: '%USERPROFILE%\Downloads\**\xemu.exe'
    args: ["-full-screen", "-dvd_path", "{rom}"]
    extensions: [.iso]

  # --- Xbox 360 (Xenia Canary), por si algún día lo usas ---
  # - id: xbox360
  #   name: Xbox 360
  #   system: xbox360
  #   executable: '%USERPROFILE%\Downloads\**\xenia_canary.exe'
  #   args: ["--fullscreen", "{rom}"]
  #   extensions: [.iso, .xex, .zar]

# Atajos extra: ejecutables o URLs/URIs. ES-DE ya aparece solo si se detecta.
apps:
  - id: youtube
    name: YouTube
    target: "https://www.youtube.com/tv"
    category: media
